name: Export Deno KV paper state (read-only)

on:
  workflow_dispatch:
    inputs:
      confirm_export:
        description: "Type EXPORT to confirm a read-only export from the configured Deno KV database"
        required: true
        type: string

permissions:
  contents: read

jobs:
  export-paper-state:
    if: ${{ inputs.confirm_export == 'EXPORT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/deno-to-cloudflare-controlled-cutover
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Read exact production bot_state and create private JSON export
        env:
          DENO_KV_DATABASE_ID: ${{ secrets.DENO_KV_DATABASE_ID }}
          DENO_KV_ACCESS_TOKEN: ${{ secrets.DENO_KV_ACCESS_TOKEN }}
          STATE_BACKUP_FILE: deno-kv-paper-state-backup.json
        run: |
          test -n "$DENO_KV_DATABASE_ID" || (echo "Missing repository secret DENO_KV_DATABASE_ID" && exit 1)
          test -n "$DENO_KV_ACCESS_TOKEN" || (echo "Missing repository secret DENO_KV_ACCESS_TOKEN" && exit 1)
          deno run --allow-net=api.deno.com --allow-read=scripts --allow-write=. scripts/export-deno-kv-paper-state.ts

      - name: Upload private short-lived backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: deno-paper-state-private-export
          path: deno-kv-paper-state-backup.json
          if-no-files-found: error
          retention-days: 1
