name: Cloudflare Worker Preview

on:
  pull_request:
    branches:
      - fix/worker-empty-state-cron-guard
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and publish isolated Preview
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
          vars.CLOUDFLARE_PREVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression tests
        run: npm test

      - name: Verify Worker build without deploying
        run: npx --yes wrangler@4.135.0 deploy --dry-run --config wrangler.jsonc

      - name: Detect Preview credentials
        id: preview_credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Preview deployment skipped: Cloudflare credentials are not configured. Tests and dry-run build still run."
          fi

      - name: Publish isolated Cloudflare Worker Preview
        if: steps.preview_credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.135.0 preview --name pr-${{ github.event.pull_request.number }} --json
