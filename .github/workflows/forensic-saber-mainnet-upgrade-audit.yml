name: Forensic Saber Mainnet upgrade audit (read-only)

on:
  push:
    branches:
      - forensics/upgrade-slot-119721738
    paths:
      - .github/workflows/forensic-saber-mainnet-upgrade-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Audit finalized upgrade transaction and current ProgramData
        env:
          SOLANA_ARCHIVE_RPC_URL: ${{ secrets.SOLANA_ARCHIVE_RPC_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime, hashlib, json, os, urllib.request

          URL = os.environ.get("SOLANA_ARCHIVE_RPC_URL", "")
          if not URL.startswith("https://") or "/v2/" not in URL:
              raise SystemExit("Archive RPC secret missing or invalid; value not printed.")

          PROGRAM = "SSwpkEEcbUqx4vtoEByFjSkhKdCT862DNVb52nZg1UZ"
          PROGRAM_DATA = "54aePuBcYcf8G3CDrWWd2MEiw6Q7UGy2kjgQBDhqoMdt"
          BUFFER = "9kDwyNPvePGfAhVoY9pezC4jJRzBetQnfttzkBuHmiW9"
          GOKI_PROGRAM = "GokivDYuQXPZCWRkwMhdH2h91KpDQXBEmpgBgs55bnpH"
          EXPECTED_SIGNATURE = "5ygvjFAXLwknuRLZVFNCCExmdPcvaTYEeYxHXv8JAWCT1cz6dgbnJ734mZaaCMcZeDQpdxFegrcwcwGKCratGiwb"
          LOADER = "BPFLoaderUpgradeab1e11111111111111111111111"
          EXPECTED_MAINNET_HASH = "c1e843d5134d3c93105f111629c364db4b8bc7aba109cc79e3b7e4b73c149c38"
          EXPECTED_BUFFER_FULL_SHA256 = "eeacf0770556dabc19c0c5e11e3f3d743367e200781bdc3d9d1c5b49c2ca6992"
          EXPECTED_BUFFER_LENGTH = 217192

          def rpc(method, params):
              body = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req = urllib.request.Request(URL, data=body, headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.load(response)
              if result.get("error"):
                  raise RuntimeError(method + " RPC error: " + json.dumps(result["error"]))
              return result.get("result")

          def account(pubkey):
              return rpc("getAccountInfo", [pubkey, {"encoding":"base64","commitment":"finalized"}]).get("value")

          def account_summary(pubkey):
              value = account(pubkey)
              if not value:
                  return None
              raw = base64.b64decode(value["data"][0])
              return {"address":pubkey,"owner":value["owner"],"executable":value["executable"],"lamports":value["lamports"],"data_length":len(raw),"data_prefix_hex":raw[:16].hex()}

          def decode_goki_smart_wallet(pubkey):
              value = account(pubkey)
              if not value:
                  return None
              raw = base64.b64decode(value["data"][0])
              expected = hashlib.sha256(b"account:SmartWallet").digest()[:8]
              if raw[:8] != expected or len(raw) < 81:
                  return {"address":pubkey,"recognized_as_smart_wallet":False,"data_length":len(raw),"discriminator_hex":raw[:8].hex()}
              owner_count = int.from_bytes(raw[77:81],"little")
              owners_end = 81 + 32 * owner_count
              if owners_end > len(raw):
                  return {"address":pubkey,"recognized_as_smart_wallet":True,"decode_error":"owner vector exceeds account data","owner_count":owner_count}
              owners = [b58encode(raw[81+32*i:113+32*i]) for i in range(owner_count)]
              return {"address":pubkey,"recognized_as_smart_wallet":True,"base":b58encode(raw[8:40]),"bump":raw[40],"threshold":int.from_bytes(raw[41:49],"little"),"minimum_delay_seconds":int.from_bytes(raw[49:57],"little",signed=True),"grace_period_seconds":int.from_bytes(raw[57:65],"little",signed=True),"owner_set_seqno":int.from_bytes(raw[65:69],"little"),"num_transactions":int.from_bytes(raw[69:77],"little"),"owner_count":owner_count,"owners":owners,"remaining_bytes_after_owner_vector":len(raw)-owners_end}

          def b58decode(value):
              alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              n = 0
              for ch in value:
                  n = n * 58 + alphabet.index(ch)
              raw = n.to_bytes((n.bit_length()+7)//8, "big") if n else b""
              return bytes([0]) * (len(value)-len(value.lstrip("1"))) + raw

          def b58encode(raw):
              alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              zeros = len(raw) - len(raw.lstrip(bytes([0])))
              n = int.from_bytes(raw, "big")
              out = ""
              while n:
                  n, rem = divmod(n, 58)
                  out = alphabet[rem] + out
              return "1" * zeros + out

          def loader_ixs(tx):
              message = tx["transaction"]["message"]
              keys = message.get("accountKeys", [])
              key_values = [k.get("pubkey") if isinstance(k,dict) else k for k in keys]
              groups = [("outer", message.get("instructions", []))]
              groups += [("inner-"+str(g.get("index")), g.get("instructions", [])) for g in (tx.get("meta") or {}).get("innerInstructions", [])]
              found = []
              for group, instructions in groups:
                  for index, ix in enumerate(instructions):
                      pid = ix.get("programId")
                      if pid is None and ix.get("programIdIndex") is not None:
                          pidx = ix["programIdIndex"]
                          pid = key_values[pidx] if pidx < len(key_values) else None
                      if pid != LOADER:
                          continue
                      raw = b58decode(ix.get("data",""))
                      disc = int.from_bytes(raw[:4],"little") if len(raw)>=4 else None
                      accts = [key_values[i] if i < len(key_values) else None for i in ix.get("accounts",[])]
                      found.append({"group":group,"instruction_index":index,"discriminator":disc,"accounts":accts})
              return found

          def outer_programs(tx):
              message = tx["transaction"]["message"]
              keys = message.get("accountKeys", [])
              key_values = [k.get("pubkey") if isinstance(k,dict) else k for k in keys]
              result = []
              for ix in message.get("instructions", []):
                  idx = ix.get("programIdIndex")
                  result.append(ix.get("programId") or (key_values[idx] if idx is not None and idx < len(key_values) else None))
              return result

          def goki_outer_accounts(tx):
              message = tx["transaction"]["message"]
              keys = message.get("accountKeys", [])
              key_values = [k.get("pubkey") if isinstance(k,dict) else k for k in keys]
              result = []
              for ix in message.get("instructions", []):
                  idx = ix.get("programIdIndex")
                  pid = ix.get("programId") or (key_values[idx] if idx is not None and idx < len(key_values) else None)
                  if pid == GOKI_PROGRAM:
                      result.extend(key_values[i] for i in ix.get("accounts",[]) if i < len(key_values))
              return list(dict.fromkeys(result))

          def decode_goki_transaction(pubkey):
              value = account(pubkey)
              if not value or value["owner"] != GOKI_PROGRAM:
                  return None
              raw = base64.b64decode(value["data"][0])
              expected = hashlib.sha256(b"account:Transaction").digest()[:8]
              if raw[:8] != expected:
                  return None

              off = 8
              def take(size, label):
                  nonlocal off
                  if size < 0 or off + size > len(raw):
                      raise ValueError(f"{label} exceeds account data at offset {off}; need {size}, have {len(raw)-off}")
                  out = raw[off:off+size]
                  off += size
                  return out

              def read_u32(label):
                  return int.from_bytes(take(4, label), "little")

              def read_u64(label):
                  return int.from_bytes(take(8, label), "little")

              def read_i64(label):
                  return int.from_bytes(take(8, label), "little", signed=True)

              try:
                  smart_wallet = b58encode(take(32, "smart_wallet"))
                  index = read_u64("index")
                  bump = take(1, "bump")[0]
                  proposer = b58encode(take(32, "proposer"))

                  # Anchor/Borsh serializes Vec<TXInstruction> as u32 length + entries.
                  instruction_count = read_u32("instructions vector length")
                  if instruction_count > 64:
                      raise ValueError(f"implausible instruction count: {instruction_count}")
                  instructions = []
                  for instruction_index in range(instruction_count):
                      ix_program = b58encode(take(32, f"instruction[{instruction_index}].program_id"))
                      key_count = read_u32(f"instruction[{instruction_index}].keys vector length")
                      if key_count > 256:
                          raise ValueError(f"implausible key count in instruction {instruction_index}: {key_count}")
                      ix_keys = []
                      for key_index in range(key_count):
                          key_raw = take(34, f"instruction[{instruction_index}].key[{key_index}]")
                          signer_flag, writable_flag = key_raw[32], key_raw[33]
                          if signer_flag not in (0, 1) or writable_flag not in (0, 1):
                              raise ValueError(f"invalid account-meta boolean in instruction {instruction_index}, key {key_index}")
                          ix_keys.append({
                              "pubkey": b58encode(key_raw[:32]),
                              "is_signer": bool(signer_flag),
                              "is_writable": bool(writable_flag)
                          })
                      data_len = read_u32(f"instruction[{instruction_index}].data vector length")
                      if data_len > 1_000_000:
                          raise ValueError(f"implausible instruction data length: {data_len}")
                      ix_data = take(data_len, f"instruction[{instruction_index}].data")
                      loader_disc = int.from_bytes(ix_data[:4], "little") if len(ix_data) >= 4 and ix_program == LOADER else None
                      instructions.append({
                          "instruction_index": instruction_index,
                          "program_id": ix_program,
                          "accounts": ix_keys,
                          "data_length": data_len,
                          "data_hex": ix_data.hex(),
                          "loader_instruction_discriminator": loader_disc
                      })

                  # signers is Vec<bool>; each bool is one byte in Borsh.
                  signer_count = read_u32("signers vector length")
                  if signer_count > 256:
                      raise ValueError(f"implausible signer count: {signer_count}")
                  signer_raw = take(signer_count, "signers vector")
                  if any(flag not in (0, 1) for flag in signer_raw):
                      raise ValueError("invalid boolean value in signers vector")
                  approvals = [bool(flag) for flag in signer_raw]
                  owner_set_seqno = read_u32("owner_set_seqno")
                  eta = read_i64("eta")
                  executor = b58encode(take(32, "executor"))
                  executed_at = read_i64("executed_at")

                  wallet_state = decode_goki_smart_wallet(smart_wallet)
                  owners = wallet_state.get("owners", []) if wallet_state and wallet_state.get("recognized_as_smart_wallet") else []
                  approval_mapping = []
                  for owner_index, approved in enumerate(approvals):
                      approval_mapping.append({
                          "owner_index": owner_index,
                          "owner": owners[owner_index] if owner_index < len(owners) else None,
                          "approved": approved
                      })
                  return {
                      "transaction_account": pubkey,
                      "smart_wallet": smart_wallet,
                      "index": index,
                      "bump": bump,
                      "proposer": proposer,
                      "instructions": instructions,
                      "instruction_count": instruction_count,
                      "approval_vector": approvals,
                      "approval_count": sum(approvals),
                      "approval_slots": signer_count,
                      "approval_owner_mapping": approval_mapping,
                      "wallet_owner_count": len(owners),
                      "approval_vector_matches_wallet_owner_count": len(owners) == signer_count if owners else None,
                      "owner_set_seqno": owner_set_seqno,
                      "owner_set_seqno_matches_current_wallet": wallet_state.get("owner_set_seqno") == owner_set_seqno if wallet_state and wallet_state.get("recognized_as_smart_wallet") else None,
                      "eta_unix": eta,
                      "executor": executor,
                      "executed_at_unix": executed_at,
                      "is_executed": executed_at != -1,
                      "decoded_bytes": off,
                      "trailing_bytes": len(raw) - off,
                      "trailing_bytes_are_zero": not any(raw[off:]),
                      "account_data_length": len(raw)
                  }
              except Exception as exc:
                  return {
                      "transaction_account": pubkey,
                      "decode_error": str(exc),
                      "decode_offset": off,
                      "account_data_length": len(raw)
                  }

          def find_goki_transactions(tx):
              found = []
              for pubkey in goki_outer_accounts(tx):
                  decoded = decode_goki_transaction(pubkey)
                  if decoded:
                      found.append(decoded)
              return found

          tx = rpc("getTransaction", [EXPECTED_SIGNATURE, {
              "encoding":"json", "commitment":"finalized", "maxSupportedTransactionVersion":0
          }])
          if tx is None:
              raise SystemExit("Upgrade transaction not found at finalized commitment.")
          message = tx["transaction"]["message"]
          meta = tx.get("meta") or {}
          key_values = [k.get("pubkey") if isinstance(k,dict) else k for k in message.get("accountKeys", [])]
          required = (message.get("header") or {}).get("numRequiredSignatures", 0)
          signers = key_values[:required]
          all_loader_ixs = loader_ixs(tx)
          target_upgrade = [u for u in all_loader_ixs if u["discriminator"] == 3 and len(u["accounts"]) > 2 and u["accounts"][0] == PROGRAM_DATA and u["accounts"][1] == PROGRAM and u["accounts"][2] == BUFFER]
          if meta.get("err") is not None or not target_upgrade:
              raise SystemExit("Recorded transaction did not successfully upgrade the target program.")
          upgrade_authority_at_time = target_upgrade[0]["accounts"][6] if len(target_upgrade[0]["accounts"]) > 6 else None

          pd = account(PROGRAM_DATA)
          prog = account(PROGRAM)
          buf = account(BUFFER)
          if not pd or not prog:
              raise SystemExit("Program or ProgramData account missing at finalized commitment.")

          pd_raw = base64.b64decode(pd["data"][0])
          pd_state_tag = int.from_bytes(pd_raw[:4],"little")
          deployment_slot = int.from_bytes(pd_raw[4:12],"little")
          auth_option = pd_raw[12] if len(pd_raw)>12 else None
          current_authority = b58encode(pd_raw[13:45]) if auth_option == 1 and len(pd_raw)>=45 else None
          payload = pd_raw[45:] if len(pd_raw)>=45 else b""
          active_prefix = payload[:EXPECTED_BUFFER_LENGTH]
          active_trimmed = active_prefix.rstrip(bytes([0]))
          suffix = payload[EXPECTED_BUFFER_LENGTH:]
          prog_raw = base64.b64decode(prog["data"][0])
          program_state_tag = int.from_bytes(prog_raw[:4],"little") if len(prog_raw)>=4 else None
          program_data_from_program = b58encode(prog_raw[4:36]) if len(prog_raw)>=36 else None
          tx_slot = tx.get("slot")

          recent = rpc("getSignaturesForAddress",[PROGRAM_DATA,{"limit":40,"commitment":"finalized"}]) or []
          later_loader_changes = []
          for item in recent:
              candidate = rpc("getTransaction",[item["signature"],{"encoding":"json","commitment":"finalized","maxSupportedTransactionVersion":0}])
              if not candidate:
                  continue
              for ix in loader_ixs(candidate):
                  if ix["accounts"] and ix["accounts"][0] == PROGRAM_DATA and ix["discriminator"] in (3,4,7):
                      if candidate.get("slot",0) > deployment_slot:
                          later_loader_changes.append({
                              "signature":item["signature"],"slot":candidate.get("slot"),
                              "block_time_unix":candidate.get("blockTime"),
                              "discriminator":ix["discriminator"],"accounts":ix["accounts"],
                              "top_level_signers":[
                                  (candidate["transaction"]["message"].get("accountKeys",[])[i].get("pubkey")
                                   if isinstance(candidate["transaction"]["message"].get("accountKeys",[])[i],dict)
                                   else candidate["transaction"]["message"].get("accountKeys",[])[i])
                                  for i in range((candidate["transaction"]["message"].get("header") or {}).get("numRequiredSignatures",0))
                              ],
                              "outer_instruction_program_ids":outer_programs(candidate),
                              "goki_outer_instruction_accounts":goki_outer_accounts(candidate),
                              "goki_transaction_state":find_goki_transactions(candidate),
                              "meta_err":(candidate.get("meta") or {}).get("err")
                          })

          authority_accounts = {
              "upgrade_authority_at_2022_upgrade":account_summary(upgrade_authority_at_time),
              "decoded_2022_upgrade_authority_smart_wallet":decode_goki_smart_wallet(upgrade_authority_at_time),
              "current_programdata_upgrade_authority":account_summary(current_authority),
              "2022_upgrade_transaction_fee_payer":account_summary(signers[0] if signers else ""),
              "goki_smart_wallet_program":account_summary(GOKI_PROGRAM)
          }
          authority_change_signatures = {
              "former_authority":rpc("getSignaturesForAddress",[upgrade_authority_at_time,{"limit":10,"commitment":"finalized"}]) if upgrade_authority_at_time else [],
              "current_authority":rpc("getSignaturesForAddress",[current_authority,{"limit":10,"commitment":"finalized"}]) if current_authority else []
          }
          report = {
              "scope":"read-only finalized Solana Mainnet audit; no transactions submitted",
              "program":PROGRAM,"program_data":PROGRAM_DATA,"buffer":BUFFER,
              "upgrade_signature":EXPECTED_SIGNATURE,
              "transaction":{
                  "slot":tx_slot,"block_time_unix":tx.get("blockTime"),
                  "block_time_utc":datetime.datetime.fromtimestamp(tx["blockTime"],datetime.timezone.utc).isoformat() if tx.get("blockTime") else None,
                  "meta_err":meta.get("err"),"fee_lamports":meta.get("fee"),
                  "required_signatures":required,"top_level_signers":signers,
                  "upgrade_instruction":target_upgrade[0],
                  "upgrade_authority_account_at_upgrade":upgrade_authority_at_time,
                  "upgrade_authority_account_is_top_level_signer":upgrade_authority_at_time in signers if upgrade_authority_at_time else False,
                  "outer_instruction_program_ids":outer_programs(tx),
                  "goki_outer_instruction_accounts":goki_outer_accounts(tx),
                  "goki_transaction_state":find_goki_transactions(tx)
              },
              "program_account":{
                  "owner":prog["owner"],"executable":prog["executable"],
                  "data_length":len(prog_raw),"loader_state_tag":program_state_tag,
                  "points_to_program_data":program_data_from_program==PROGRAM_DATA,
                  "program_data_address":program_data_from_program
              },
              "program_data_account":{
                  "owner":pd["owner"],"executable":pd["executable"],
                  "data_length":len(pd_raw),"loader_state_tag":pd_state_tag,
                  "last_deployment_slot":deployment_slot,
                  "deployment_slot_matches_upgrade_transaction":deployment_slot==tx_slot,
                  "current_upgrade_authority":current_authority,
                  "upgrade_authority_option":auth_option,
                  "upgrade_authority_changed_since_upgrade":current_authority != upgrade_authority_at_time,
                  "program_payload_capacity":len(payload),
                  "active_prefix_length_from_buffer_history":len(active_prefix),
                  "active_prefix_full_sha256":hashlib.sha256(active_prefix).hexdigest(),
                  "active_prefix_matches_reconstructed_buffer":hashlib.sha256(active_prefix).hexdigest()==EXPECTED_BUFFER_FULL_SHA256,
                  "active_prefix_trimmed_length":len(active_trimmed),
                  "active_prefix_trimmed_sha256":hashlib.sha256(active_trimmed).hexdigest(),
                  "active_prefix_matches_mainnet_executable_hash":hashlib.sha256(active_trimmed).hexdigest()==EXPECTED_MAINNET_HASH,
                  "bytes_after_buffer_payload_length":len(suffix),
                  "suffix_sha256":hashlib.sha256(suffix).hexdigest() if suffix else None
              },
              "buffer_account_exists_now":buf is not None,
              "authority_account_ownership_and_recent_activity":authority_accounts,
              "authority_account_recent_signatures":authority_change_signatures,
              "later_loader_upgrade_or_authority_change_in_recent_40_programdata_signatures":later_loader_changes
          }
          with open("saber-mainnet-upgrade-audit.json","w") as f:
              json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          checks = [
              meta.get("err") is None,
              deployment_slot == tx_slot,
              program_data_from_program == PROGRAM_DATA,
              hashlib.sha256(active_prefix).hexdigest() == EXPECTED_BUFFER_FULL_SHA256,
              hashlib.sha256(active_trimmed).hexdigest() == EXPECTED_MAINNET_HASH,
              not [x for x in later_loader_changes if x["discriminator"] == 3]
          ]
          if not all(checks):
              raise SystemExit("One or more forensic consistency checks failed; see report.")
          PY

      - name: Trace all historical Goki wallet transactions and owner-set changes
        env:
          SOLANA_ARCHIVE_RPC_URL: ${{ secrets.SOLANA_ARCHIVE_RPC_URL }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet solders
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from solders.pubkey import Pubkey

          URL = os.environ["SOLANA_ARCHIVE_RPC_URL"]
          WALLET = "BkkBFsRm6VCbZyBG82yuHBnyjJwUJHv1nTJ3GiY44Tkr"
          GOKI = "GokivDYuQXPZCWRkwMhdH2h91KpDQXBEmpgBgs55bnpH"
          def rpc(method, params):
              body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(URL,data=body,headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=60) as r: out=json.load(r)
              if out.get("error"): raise RuntimeError(method+": "+json.dumps(out["error"]))
              return out.get("result")
          def b58(raw):
              alphabet="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              zeros=len(raw)-len(raw.lstrip(bytes([0]))); n=int.from_bytes(raw,"big"); s=""
              while n: n,rem=divmod(n,58); s=alphabet[rem]+s
              return "1"*zeros+s
          def take(raw, off, n):
              if off+n>len(raw): raise ValueError("truncated Borsh data")
              return raw[off:off+n],off+n
          def u32(raw,off):
              b,off=take(raw,off,4); return int.from_bytes(b,"little"),off
          wallet=rpc("getAccountInfo",[WALLET,{"encoding":"base64","commitment":"finalized"}])["value"]
          if not wallet: raise SystemExit("Goki SmartWallet account unavailable")
          wr=base64.b64decode(wallet["data"][0])
          if wr[:8]!=hashlib.sha256(b"account:SmartWallet").digest()[:8]: raise SystemExit("SmartWallet discriminator mismatch")
          seq=int.from_bytes(wr[65:69],"little"); count=int.from_bytes(wr[69:77],"little")
          owner_count=int.from_bytes(wr[77:81],"little")
          current=[b58(wr[81+32*i:113+32*i]) for i in range(owner_count)]
          # Recover the original seqno-0 owner set and dated owner-change events from Anchor logs.
          event_discs={name:hashlib.sha256(("event:"+name).encode()).digest()[:8] for name in ("WalletCreateEvent","WalletSetOwnersEvent")}
          wallet_events=[]
          sigs=rpc("getSignaturesForAddress",[WALLET,{"limit":1000,"commitment":"finalized"}]) or []
          for item in sigs:
              tr=rpc("getTransaction",[item["signature"],{"encoding":"json","commitment":"finalized","maxSupportedTransactionVersion":0}])
              if not tr: continue
              for line in ((tr.get("meta") or {}).get("logMessages") or []):
                  if not line.startswith("Program data: "): continue
                  try: ev=base64.b64decode(line.split(" ",2)[2])
                  except Exception: continue
                  for name,disc in event_discs.items():
                      if ev[:8]!=disc: continue
                      try:
                          pos=8
                          wallet_bytes=ev[pos:pos+32]; pos+=32
                          if len(wallet_bytes)!=32 or b58(wallet_bytes)!=WALLET: continue
                          n,pos=u32(ev,pos)
                          if n>100: continue
                          owners=[b58(ev[pos+32*i:pos+32*(i+1)]) for i in range(n)]
                          pos+=32*n
                          event={"event":name,"signature":item["signature"],"slot":tr.get("slot"),"block_time_unix":tr.get("blockTime"),"owners":owners}
                          if name=="WalletCreateEvent":
                              event["threshold"]=int.from_bytes(ev[pos:pos+8],"little"); pos+=8
                              event["minimum_delay_seconds"]=int.from_bytes(ev[pos:pos+8],"little",signed=True); pos+=8
                          event["event_timestamp_unix"]=int.from_bytes(ev[pos:pos+8],"little",signed=True)
                          wallet_events.append(event)
                      except Exception: pass
          pid=Pubkey.from_string(GOKI); wallet_pk=Pubkey.from_string(WALLET)
          owner_disc=hashlib.sha256(b"global:set_owners").digest()[:8]
          changes=[]; scanned=0; missing=[]
          for idx in range(count):
              addr,_=Pubkey.find_program_address([b"GokiTransaction",bytes(wallet_pk),idx.to_bytes(8,"little")],pid)
              ai=rpc("getAccountInfo",[str(addr),{"encoding":"base64","commitment":"finalized"}])["value"]
              if not ai:
                  missing.append(idx); continue
              if ai["owner"]!=GOKI: continue
              raw=base64.b64decode(ai["data"][0]); scanned+=1
              if raw[:8]!=hashlib.sha256(b"account:Transaction").digest()[:8]: continue
              off=8+32+8+1+32
              n,off=u32(raw,off)
              for ixn in range(n):
                  prog,off=take(raw,off,32); nk,off=u32(raw,off)
                  off += nk*34
                  dl,off=u32(raw,off); data,off=take(raw,off,dl)
                  if prog==bytes(pid) and data[:8]==owner_disc:
                      c,pos=u32(data,8)
                      if c>100: raise ValueError("implausible set_owners vector")
                      owners=[b58(data[pos+32*i:pos+32*(i+1)]) for i in range(c)]
                      changes.append({"transaction_index":idx,"transaction_account":str(addr),"owner_set_seqno_before":int.from_bytes(raw[off:off+4],"little") if False else None,"new_owner_count":c,"new_owners":owners,"instruction_data_length":dl})
          # Inspect the earliest wallet signature for the original create_smart_wallet instruction.
          oldest_wallet_tx=None
          if sigs:
              oldest=sigs[-1]
              tr=rpc("getTransaction",[oldest["signature"],{"encoding":"json","commitment":"finalized","maxSupportedTransactionVersion":0}])
              if tr:
                  msg=tr["transaction"]["message"]; keys=[k.get("pubkey") if isinstance(k,dict) else k for k in msg.get("accountKeys",[])]
                  alphabet="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
                  def b58dec(s):
                      v=0
                      for ch in s: v=v*58+alphabet.index(ch)
                      b=v.to_bytes((v.bit_length()+7)//8,"big") if v else b""
                      return bytes([0])*(len(s)-len(s.lstrip("1")))+b
                  create_disc=hashlib.sha256(b"global:create_smart_wallet").digest()[:8]
                  decoded=[]
                  for ix in msg.get("instructions",[]):
                      pi=ix.get("programId") or (keys[ix["programIdIndex"]] if "programIdIndex" in ix else None)
                      if pi!=GOKI: continue
                      raw=b58dec(ix.get("data",""))
                      item={"data_length":len(raw),"data_prefix_hex":raw[:48].hex(),"accounts":[keys[i] for i in ix.get("accounts",[]) if i<len(keys)]}
                      if raw[:8]==create_disc:
                          pos=8+1+1
                          n,pos=u32(raw,pos)
                          if n<=100:
                              item["decoded_initial_owners"]=[b58(raw[pos+32*i:pos+32*(i+1)]) for i in range(n)]
                              pos+=32*n
                              item["initial_threshold"]=int.from_bytes(raw[pos:pos+8],"little"); pos+=8
                              item["initial_minimum_delay_seconds"]=int.from_bytes(raw[pos:pos+8],"little",signed=True)
                      decoded.append(item)
                  oldest_wallet_tx={"signature":oldest["signature"],"slot":tr.get("slot"),"block_time_unix":tr.get("blockTime"),"goki_instructions":decoded,"log_tail":((tr.get("meta") or {}).get("logMessages") or [])[-12:]}
          report={"wallet":WALLET,"current_owner_set_seqno":seq,"current_owners":current,"num_transactions":count,"transaction_accounts_scanned":scanned,"missing_transaction_indices":missing,"set_owners_transactions":changes,"wallet_creation_and_owner_change_events":wallet_events,"wallet_signatures_scanned":len(sigs),"oldest_wallet_transaction":oldest_wallet_tx,"scope":"read-only finalized Mainnet RPC; no transactions submitted"}
          with open("goki-owner-history.json","w") as f: json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          PY
      - name: Upload Goki owner-history audit
        uses: actions/upload-artifact@v4
        with:
          name: goki-owner-history-audit
          path: goki-owner-history.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload sanitized read-only audit
        uses: actions/upload-artifact@v4
        with:
          name: saber-mainnet-upgrade-audit
          path: saber-mainnet-upgrade-audit.json
          retention-days: 7
          if-no-files-found: error
