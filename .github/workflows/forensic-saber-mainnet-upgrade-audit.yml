          import hashlib,json
          from elftools.elf.elffile import ELFFile
          def inspect(path):
              out={"file":path,"sections":[],"symbols":[]}
              with open(path,"rb") as f:
                  elf=ELFFile(f)
                  out["elf_header"]={"class":elf.elfclass,"little_endian":elf.little_endian,"machine":elf.header["e_machine"],"type":elf.header["e_type"],"entry":int(elf.header["e_entry"])}
                  for sec in elf.iter_sections():
                      data=sec.data()
                      out["sections"].append({"name":sec.name,"type":str(sec["sh_type"]),"flags":int(sec["sh_flags"]),"addr":int(sec["sh_addr"]),"offset":int(sec["sh_offset"]),"size":int(sec["sh_size"]),"sha256":hashlib.sha256(data).hexdigest()})
                      if sec.name in (".symtab",".dynsym"):
                          for sym in sec.iter_symbols():
                              if sym.name:
                                  out["symbols"].append({"name":sym.name,"value":int(sym["st_value"]),"size":int(sym["st_size"]),"type":str(sym["st_info"]["type"]),"bind":str(sym["st_info"]["bind"]),"section":str(sym["st_shndx"])})
              return out
          a=inspect("mainnet-active-prefix.bin"); b=inspect("official-v172.so")
          amap={x["name"]:x for x in a["sections"]}; bmap={x["name"]:x for x in b["sections"]}
          report={"mainnet":a,"official_v172":b,"section_comparison":[]}
          for name in sorted(set(amap)|set(bmap)):
              x=amap.get(name); y=bmap.get(name)
              report["section_comparison"].append({"name":name,"mainnet_size":x["size"] if x else None,"release_size":y["size"] if y else None,"mainnet_sha256":x["sha256"] if x else None,"release_sha256":y["sha256"] if y else None,"exact_match":bool(x and y and x["size"]==y["size"] and x["sha256"]==y["sha256"])})
          open("elf-section-comparison.json","w").write(json.dumps(report,indent=2))
          print(json.dumps({"mainnet_header":a["elf_header"],"release_header":b["elf_header"],"sections":report["section_comparison"],"mainnet_symbol_count":len(a["symbols"]),"release_symbol_count":len(b["symbols"]),"symbol_names_match":sorted(x["name"] for x in a["symbols"])==sorted(x["name"] for x in b["symbols"])},indent=2))
          PY
          python3 - <<'PY'
          import json
          a=open("mainnet-active-prefix.bin","rb").read()
          b=open("official-v172.so","rb").read()
          n=min(len(a),len(b))
