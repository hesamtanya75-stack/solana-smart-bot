name: Forensic Saber Mainnet upgrade audit (read-only)

on:
  push:
    branches:
      - forensics/upgrade-slot-119721738
    paths:
      - .github/workflows/forensic-saber-mainnet-upgrade-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Audit finalized upgrade transaction and current ProgramData
        env:
          SOLANA_ARCHIVE_RPC_URL: ${{ secrets.SOLANA_ARCHIVE_RPC_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime, hashlib, json, os, urllib.request

          URL = os.environ.get("SOLANA_ARCHIVE_RPC_URL", "")
          if not URL.startswith("https://") or "/v2/" not in URL:
              raise SystemExit("Archive RPC secret missing or invalid; value not printed.")

          PROGRAM = "SSwpkEEcbUqx4vtoEByFjSkhKdCT862DNVb52nZg1UZ"
          PROGRAM_DATA = "54aePuBcYcf8G3CDrWWd2MEiw6Q7UGy2kjgQBDhqoMdt"
          BUFFER = "9kDwyNPvePGfAhVoY9pezC4jJRzBetQnfttzkBuHmiW9"
          GOKI_PROGRAM = "GokivDYuQXPZCWRkwMhdH2h91KpDQXBEmpgBgs55bnpH"
          EXPECTED_SIGNATURE = "5ygvjFAXLwknuRLZVFNCCExmdPcvaTYEeYxHXv8JAWCT1cz6dgbnJ734mZaaCMcZeDQpdxFegrcwcwGKCratGiwb"
          LOADER = "BPFLoaderUpgradeab1e11111111111111111111111"
          EXPECTED_MAINNET_HASH = "c1e843d5134d3c93105f111629c364db4b8bc7aba109cc79e3b7e4b73c149c38"
          EXPECTED_BUFFER_FULL_SHA256 = "eeacf0770556dabc19c0c5e11e3f3d743367e200781bdc3d9d1c5b49c2ca6992"
          EXPECTED_BUFFER_LENGTH = 217192

          def rpc(method, params):
              body = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req = urllib.request.Request(URL, data=body, headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.load(response)
              if result.get("error"):
                  raise RuntimeError(method + " RPC error: " + json.dumps(result["error"]))
              return result.get("result")

          def account(pubkey):
              return rpc("getAccountInfo", [pubkey, {"encoding":"base64","commitment":"finalized"}]).get("value")

          def account_summary(pubkey):
              value = account(pubkey)
              if not value:
                  return None
              raw = base64.b64decode(value["data"][0])
              return {"address":pubkey,"owner":value["owner"],"executable":value["executable"],"lamports":value["lamports"],"data_length":len(raw),"data_prefix_hex":raw[:16].hex()}

          def decode_goki_smart_wallet(pubkey):
              value = account(pubkey)
              if not value:
                  return None
              raw = base64.b64decode(value["data"][0])
              expected = hashlib.sha256(b"account:SmartWallet").digest()[:8]
              if raw[:8] != expected or len(raw) < 81:
                  return {"address":pubkey,"recognized_as_smart_wallet":False,"data_length":len(raw),"discriminator_hex":raw[:8].hex()}
              owner_count = int.from_bytes(raw[77:81],"little")
              owners_end = 81 + 32 * owner_count
              if owners_end > len(raw):
                  return {"address":pubkey,"recognized_as_smart_wallet":True,"decode_error":"owner vector exceeds account data","owner_count":owner_count}
              owners = [b58encode(raw[81+32*i:113+32*i]) for i in range(owner_count)]
              return {"address":pubkey,"recognized_as_smart_wallet":True,"base":b58encode(raw[8:40]),"bump":raw[40],"threshold":int.from_bytes(raw[41:49],"little"),"minimum_delay_seconds":int.from_bytes(raw[49:57],"little",signed=True),"grace_period_seconds":int.from_bytes(raw[57:65],"little",signed=True),"owner_set_seqno":int.from_bytes(raw[65:69],"little"),"num_transactions":int.from_bytes(raw[69:77],"little"),"owner_count":owner_count,"owners":owners,"remaining_bytes_after_owner_vector":len(raw)-owners_end}

          def b58decode(value):
              alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              n = 0
              for ch in value:
                  n = n * 58 + alphabet.index(ch)
              raw = n.to_bytes((n.bit_length()+7)//8, "big") if n else b""
              return bytes([0]) * (len(value)-len(value.lstrip("1"))) + raw

          def b58encode(raw):
              alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              zeros = len(raw) - len(raw.lstrip(bytes([0])))
              n = int.from_bytes(raw, "big")
              out = ""
              while n:
                  n, rem = divmod(n, 58)
                  out = alphabet[rem] + out
              return "1" * zeros + out

          def loader_ixs(tx):
              message = tx["transaction"]["message"]
              keys = message.get("accountKeys", [])
              key_values = [k.get("pubkey") if isinstance(k,dict) else k for k in keys]
              groups = [("outer", message.get("instructions", []))]
              groups += [("inner-"+str(g.get("index")), g.get("instructions", [])) for g in (tx.get("meta") or {}).get("innerInstructions", [])]
              found = []
              for group, instructions in groups:
                  for index, ix in enumerate(instructions):
                      pid = ix.get("programId")
                      if pid is None and ix.get("programIdIndex") is not None:
                          pidx = ix["programIdIndex"]
                          pid = key_values[pidx] if pidx < len(key_values) else None
                      if pid != LOADER:
                          continue
                      raw = b58decode(ix.get("data",""))
                      disc = int.from_bytes(raw[:4],"little") if len(raw)>=4 else None
                      accts = [key_values[i] if i < len(key_values) else None for i in ix.get("accounts",[])]
                      found.append({"group":group,"instruction_index":index,"discriminator":disc,"accounts":accts})
              return found

          def outer_programs(tx):
              message = tx["transaction"]["message"]
              keys = message.get("accountKeys", [])
              key_values = [k.get("pubkey") if isinstance(k,dict) else k for k in keys]
              result = []
              for ix in message.get("instructions", []):
                  idx = ix.get("programIdIndex")
                  result.append(ix.get("programId") or (key_values[idx] if idx is not None and idx < len(key_values) else None))
              return result

          tx = rpc("getTransaction", [EXPECTED_SIGNATURE, {
              "encoding":"json", "commitment":"finalized", "maxSupportedTransactionVersion":0
          }])
          if tx is None:
              raise SystemExit("Upgrade transaction not found at finalized commitment.")
          message = tx["transaction"]["message"]
          meta = tx.get("meta") or {}
          key_values = [k.get("pubkey") if isinstance(k,dict) else k for k in message.get("accountKeys", [])]
          required = (message.get("header") or {}).get("numRequiredSignatures", 0)
          signers = key_values[:required]
          all_loader_ixs = loader_ixs(tx)
          target_upgrade = [u for u in all_loader_ixs if u["discriminator"] == 3 and len(u["accounts"]) > 2 and u["accounts"][0] == PROGRAM_DATA and u["accounts"][1] == PROGRAM and u["accounts"][2] == BUFFER]
          if meta.get("err") is not None or not target_upgrade:
              raise SystemExit("Recorded transaction did not successfully upgrade the target program.")
          upgrade_authority_at_time = target_upgrade[0]["accounts"][6] if len(target_upgrade[0]["accounts"]) > 6 else None

          pd = account(PROGRAM_DATA)
          prog = account(PROGRAM)
          buf = account(BUFFER)
          if not pd or not prog:
              raise SystemExit("Program or ProgramData account missing at finalized commitment.")

          pd_raw = base64.b64decode(pd["data"][0])
          pd_state_tag = int.from_bytes(pd_raw[:4],"little")
          deployment_slot = int.from_bytes(pd_raw[4:12],"little")
          auth_option = pd_raw[12] if len(pd_raw)>12 else None
          current_authority = b58encode(pd_raw[13:45]) if auth_option == 1 and len(pd_raw)>=45 else None
          payload = pd_raw[45:] if len(pd_raw)>=45 else b""
          active_prefix = payload[:EXPECTED_BUFFER_LENGTH]
          active_trimmed = active_prefix.rstrip(bytes([0]))
          suffix = payload[EXPECTED_BUFFER_LENGTH:]
          prog_raw = base64.b64decode(prog["data"][0])
          program_state_tag = int.from_bytes(prog_raw[:4],"little") if len(prog_raw)>=4 else None
          program_data_from_program = b58encode(prog_raw[4:36]) if len(prog_raw)>=36 else None
          tx_slot = tx.get("slot")

          recent = rpc("getSignaturesForAddress",[PROGRAM_DATA,{"limit":40,"commitment":"finalized"}]) or []
          later_loader_changes = []
          for item in recent:
              candidate = rpc("getTransaction",[item["signature"],{"encoding":"json","commitment":"finalized","maxSupportedTransactionVersion":0}])
              if not candidate:
                  continue
              for ix in loader_ixs(candidate):
                  if ix["accounts"] and ix["accounts"][0] == PROGRAM_DATA and ix["discriminator"] in (3,4,7):
                      if candidate.get("slot",0) > deployment_slot:
                          later_loader_changes.append({
                              "signature":item["signature"],"slot":candidate.get("slot"),
                              "block_time_unix":candidate.get("blockTime"),
                              "discriminator":ix["discriminator"],"accounts":ix["accounts"],
                              "top_level_signers":[
                                  (candidate["transaction"]["message"].get("accountKeys",[])[i].get("pubkey")
                                   if isinstance(candidate["transaction"]["message"].get("accountKeys",[])[i],dict)
                                   else candidate["transaction"]["message"].get("accountKeys",[])[i])
                                  for i in range((candidate["transaction"]["message"].get("header") or {}).get("numRequiredSignatures",0))
                              ],
                              "outer_instruction_program_ids":outer_programs(candidate),
                              "meta_err":(candidate.get("meta") or {}).get("err")
                          })

          authority_accounts = {
              "upgrade_authority_at_2022_upgrade":account_summary(upgrade_authority_at_time),
              "decoded_2022_upgrade_authority_smart_wallet":decode_goki_smart_wallet(upgrade_authority_at_time),
              "current_programdata_upgrade_authority":account_summary(current_authority),
              "2022_upgrade_transaction_fee_payer":account_summary(signers[0] if signers else ""),
              "goki_smart_wallet_program":account_summary(GOKI_PROGRAM)
          }
          authority_change_signatures = {
              "former_authority":rpc("getSignaturesForAddress",[upgrade_authority_at_time,{"limit":10,"commitment":"finalized"}]) if upgrade_authority_at_time else [],
              "current_authority":rpc("getSignaturesForAddress",[current_authority,{"limit":10,"commitment":"finalized"}]) if current_authority else []
          }
          report = {
              "scope":"read-only finalized Solana Mainnet audit; no transactions submitted",
              "program":PROGRAM,"program_data":PROGRAM_DATA,"buffer":BUFFER,
              "upgrade_signature":EXPECTED_SIGNATURE,
              "transaction":{
                  "slot":tx_slot,"block_time_unix":tx.get("blockTime"),
                  "block_time_utc":datetime.datetime.fromtimestamp(tx["blockTime"],datetime.timezone.utc).isoformat() if tx.get("blockTime") else None,
                  "meta_err":meta.get("err"),"fee_lamports":meta.get("fee"),
                  "required_signatures":required,"top_level_signers":signers,
                  "upgrade_instruction":target_upgrade[0],
                  "upgrade_authority_account_at_upgrade":upgrade_authority_at_time,
                  "upgrade_authority_account_is_top_level_signer":upgrade_authority_at_time in signers if upgrade_authority_at_time else False,
                  "outer_instruction_program_ids":outer_programs(tx)
              },
              "program_account":{
                  "owner":prog["owner"],"executable":prog["executable"],
                  "data_length":len(prog_raw),"loader_state_tag":program_state_tag,
                  "points_to_program_data":program_data_from_program==PROGRAM_DATA,
                  "program_data_address":program_data_from_program
              },
              "program_data_account":{
                  "owner":pd["owner"],"executable":pd["executable"],
                  "data_length":len(pd_raw),"loader_state_tag":pd_state_tag,
                  "last_deployment_slot":deployment_slot,
                  "deployment_slot_matches_upgrade_transaction":deployment_slot==tx_slot,
                  "current_upgrade_authority":current_authority,
                  "upgrade_authority_option":auth_option,
                  "upgrade_authority_changed_since_upgrade":current_authority != upgrade_authority_at_time,
                  "program_payload_capacity":len(payload),
                  "active_prefix_length_from_buffer_history":len(active_prefix),
                  "active_prefix_full_sha256":hashlib.sha256(active_prefix).hexdigest(),
                  "active_prefix_matches_reconstructed_buffer":hashlib.sha256(active_prefix).hexdigest()==EXPECTED_BUFFER_FULL_SHA256,
                  "active_prefix_trimmed_length":len(active_trimmed),
                  "active_prefix_trimmed_sha256":hashlib.sha256(active_trimmed).hexdigest(),
                  "active_prefix_matches_mainnet_executable_hash":hashlib.sha256(active_trimmed).hexdigest()==EXPECTED_MAINNET_HASH,
                  "bytes_after_buffer_payload_length":len(suffix),
                  "suffix_sha256":hashlib.sha256(suffix).hexdigest() if suffix else None
              },
              "buffer_account_exists_now":buf is not None,
              "authority_account_ownership_and_recent_activity":authority_accounts,
              "authority_account_recent_signatures":authority_change_signatures,
              "later_loader_upgrade_or_authority_change_in_recent_40_programdata_signatures":later_loader_changes
          }
          with open("saber-mainnet-upgrade-audit.json","w") as f:
              json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          checks = [
              meta.get("err") is None,
              deployment_slot == tx_slot,
              program_data_from_program == PROGRAM_DATA,
              hashlib.sha256(active_prefix).hexdigest() == EXPECTED_BUFFER_FULL_SHA256,
              hashlib.sha256(active_trimmed).hexdigest() == EXPECTED_MAINNET_HASH,
              not [x for x in later_loader_changes if x["discriminator"] == 3]
          ]
          if not all(checks):
              raise SystemExit("One or more forensic consistency checks failed; see report.")
          PY

      - name: Upload sanitized read-only audit
        uses: actions/upload-artifact@v4
        with:
          name: saber-mainnet-upgrade-audit
          path: saber-mainnet-upgrade-audit.json
          retention-days: 7
          if-no-files-found: error
