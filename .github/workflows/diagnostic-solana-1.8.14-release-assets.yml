name: Verify official Solana 1.8.14 GitHub release assets

on:
  push:
    branches:
      - diagnostic/solana-1.8.14-github-release

permissions:
  contents: read

jobs:
  verify-official-release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official release manifest and Linux toolchain archive
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/solana-labs/solana/releases/download/v1.8.14"
          curl --fail --location --retry 2 --retry-delay 2 --max-time 90 \
            "$base/solana-release-x86_64-unknown-linux-gnu.yml" \
            -o /tmp/solana-release.yml
          curl --fail --location --retry 2 --retry-delay 2 --max-time 600 \
            "$base/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
            -o /tmp/solana-release.tar.bz2
          echo "=== Official v1.8.14 release manifest ==="
          cat /tmp/solana-release.yml
          expected="$(grep -Eo '[a-fA-F0-9]{64}' /tmp/solana-release.yml | head -n 1)"
          test -n "$expected"
          actual="$(sha256sum /tmp/solana-release.tar.bz2 | awk '{print $1}')"
          echo "manifest_sha256=$expected"
          echo "download_sha256=$actual"
          test "${actual,,}" = "${expected,,}"
          echo "official_archive_checksum_match=true"
          echo "archive_bytes=$(wc -c < /tmp/solana-release.tar.bz2)"
          echo "=== Relevant archive paths ==="
          tar -tjf /tmp/solana-release.tar.bz2 | grep -E '(^|/)(solana|cargo-build-bpf|sdk/bpf|platform-tools)(/|$)' | head -n 80 || true

      - name: Extract release and verify installed tool versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/solana-1.8.14
          tar -xjf /tmp/solana-release.tar.bz2 -C /tmp/solana-1.8.14
          solana_bin="$(find /tmp/solana-1.8.14 -type f -path '*/bin/solana' | head -n 1)"
          test -n "$solana_bin"
          echo "solana_binary=$solana_bin"
          "$solana_bin" --version
          find /tmp/solana-1.8.14 -type f \( -name cargo-build-bpf -o -name solana-bpf-rustup \) -print
          find /tmp/solana-1.8.14 -type d -path '*/sdk/bpf' -print
          find /tmp/solana-1.8.14 -maxdepth 5 -type d -name platform-tools -print

      - name: Inspect the separately published BPF SDK asset
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/solana-labs/solana/releases/download/v1.8.14/bpf-sdk.tar.bz2"
          curl --fail --location --retry 2 --retry-delay 2 --max-time 90 "$url" -o /tmp/bpf-sdk.tar.bz2
          echo "bpf_sdk_bytes=$(wc -c < /tmp/bpf-sdk.tar.bz2)"
          sha256sum /tmp/bpf-sdk.tar.bz2
          echo "=== BPF SDK archive entries ==="
          tar -tjf /tmp/bpf-sdk.tar.bz2 | head -n 100

      - name: Upload verified release asset report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-1.8.14-official-release-asset-check
          path: |
            /tmp/solana-release.yml
          if-no-files-found: warn
          retention-days: 7
