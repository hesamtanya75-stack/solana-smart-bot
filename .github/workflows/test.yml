name: Node tests

on:
  pull_request:
  push:
    branches:
      - main
      - mainnet-live-trading-prep

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated Durable Objects test runtime
        run: npm install --no-save --ignore-scripts --package-lock=true miniflare@4
      - name: Generate a temporary dependency lockfile for audit
        run: npm install --package-lock-only --ignore-scripts --package-lock=true miniflare@4
      - name: Report dependency audit details for the isolated test runtime
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e 'const fs=require("node:fs"); const raw=fs.readFileSync("npm-audit.json","utf8"); let a; try { a=JSON.parse(raw); } catch { console.log("npm audit did not return JSON; see npm output above"); process.exit(0); } for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable})); if (!Object.keys(a.vulnerabilities||{}).length) console.log("No dependency vulnerabilities reported by npm audit.");'
      - name: Run safety and Durable Objects runtime tests
        run: npm test
