name: Node tests

on:
  pull_request:
  push:
    branches:
      - main
      - mainnet-live-trading-prep

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run safety tests
        run: npm test
