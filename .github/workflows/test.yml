name: Node tests

on:
  pull_request:
  push:
    branches:
      - main
      - mainnet-live-trading-prep

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated Durable Objects test runtime
        run: npm install --no-save --ignore-scripts --package-lock=true miniflare@3
      - name: Report dependency audit details for the isolated test runtime
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable}));'
      - name: Run safety and Durable Objects runtime tests
        run: npm test
