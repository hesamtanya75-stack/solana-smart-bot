name: Forensic Solana upgrade-slot lookup

on:
  push:
    branches:
      - forensics/upgrade-slot-119721738
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate archive RPC endpoint without exposing it
        env:
          SOLANA_ARCHIVE_RPC_URL: ${{ secrets.SOLANA_ARCHIVE_RPC_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ.get("SOLANA_ARCHIVE_RPC_URL", "")
          if not value or value != value.strip() or any(ch.isspace() for ch in value):
              raise SystemExit("::error::Archive RPC secret is missing or contains whitespace.")
          parsed = urlsplit(value)
          if parsed.scheme != "https" or not parsed.hostname or not parsed.path.startswith("/v2/"):
              raise SystemExit("::error::Archive RPC endpoint format is invalid.")
          print("Archive RPC endpoint format is valid; secret value remains hidden.")
          PY

      - name: Fetch nearby finalized blocks and inspect raw loader instructions
        env:
          SOLANA_ARCHIVE_RPC_URL: ${{ secrets.SOLANA_ARCHIVE_RPC_URL }}
        run: |
          set -euo pipefail
          for SLOT in 119721736 119721737 119721738 119721739 119721740; do
            printf '%s' "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getBlock\",\"params\":[${SLOT},{\"commitment\":\"finalized\",\"encoding\":\"json\",\"transactionDetails\":\"full\",\"maxSupportedTransactionVersion\":0,\"rewards\":false}]}" > request.json
            http_code="$(curl --silent --show-error --output "block-${SLOT}.json" --write-out '%{http_code}' \
              --request POST "$SOLANA_ARCHIVE_RPC_URL" \
              --header 'Content-Type: application/json' \
              --data-binary @request.json)"
            if [ "$http_code" != "200" ] || ! jq -e '.result != null' "block-${SLOT}.json" >/dev/null; then
              echo "::error::Solana RPC failed for slot ${SLOT}; endpoint value is intentionally not printed."
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          def b58decode(value):
              n = 0
              for ch in value:
                  n = n * 58 + alphabet.index(ch)
              raw = n.to_bytes((n.bit_length() + 7) // 8, "big") if n else b""
              return b"\\x00" * (len(value) - len(value.lstrip("1"))) + raw

          loader = "BPFLoaderUpgradeab1e11111111111111111111111"
          reports = []
          for slot in range(119721736, 119721741):
              block = json.load(open(f"block-{slot}.json"))["result"]
              found, loader_count, discriminators, program_ids = [], 0, {}, {}
              for tx in block.get("transactions", []):
                  transaction = tx.get("transaction", {})
                  message = transaction.get("message", {})
                  meta = tx.get("meta") or {}
                  keys = message.get("accountKeys", [])
                  keys = [k.get("pubkey") if isinstance(k, dict) else k for k in keys]
                  loaded = meta.get("loadedAddresses") or {}
                  all_keys = keys + loaded.get("writable", []) + loaded.get("readonly", [])
                  signatures = transaction.get("signatures", [])
                  instruction_groups = [("outer", message.get("instructions", []))]
                  instruction_groups += [(f"inner-{group.get('index')}", group.get("instructions", []))
                                          for group in meta.get("innerInstructions", [])]
                  for group_name, instructions in instruction_groups:
                      for ix_index, ix in enumerate(instructions):
                          pid_index = ix.get("programIdIndex")
                          if pid_index is None or pid_index >= len(all_keys):
                              continue
                          program_id = all_keys[pid_index]
                          program_ids[program_id] = program_ids.get(program_id, 0) + 1
                          raw = b58decode(ix.get("data", ""))
                          if program_id != loader:
                              continue
                          loader_count += 1
                          if raw:
                              discriminator = raw[0]
                              discriminators[str(discriminator)] = discriminators.get(str(discriminator), 0) + 1
                              if discriminator == 3:
                                  account_indexes = ix.get("accounts", [])
                                  account_values = [all_keys[i] if i < len(all_keys) else None for i in account_indexes]
                                  names = ["programData", "program", "buffer", "spill", "rent", "clock", "authority"]
                                  found.append({
                                      "signature": signatures[0] if signatures else None,
                                      "instruction_group": group_name,
                                      "instruction_index": ix_index,
                                      "discriminator": discriminator,
                                      "accounts": dict(zip(names, account_values))
                                  })
              reports.append({
                  "slot": slot,
                  "blockhash": block.get("blockhash"),
                  "transaction_count": len(block.get("transactions", [])),
                  "loader_instruction_count": loader_count,
                  "loader_discriminators": discriminators,
                  "upgrade_candidates": found,
                  "loader_program_present": loader in program_ids
              })
          output = {"slot_window": [119721736, 119721740], "reports": reports}
          with open("upgrade-candidates.json", "w") as f:
              json.dump(output, f, indent=2)
          print(json.dumps(output, indent=2))
          PY

      - name: Retrieve Buffer history and reconstruct written bytes
        env:
          SOLANA_ARCHIVE_RPC_URL: ${{ secrets.SOLANA_ARCHIVE_RPC_URL }}
        run: |
          set -euo pipefail
          cat > reconstruct.py <<'PY'
          import concurrent.futures, hashlib, json, os, struct, urllib.request

          URL = os.environ["SOLANA_ARCHIVE_RPC_URL"]
          BUFFER = "9kDwyNPvePGfAhVoY9pezC4jJRzBetQnfttzkBuHmiW9"
          LOADER = "BPFLoaderUpgradeab1e11111111111111111111111"
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"

          def b58decode(value):
              n = 0
              for ch in value:
                  n = n * 58 + ALPHABET.index(ch)
              raw = n.to_bytes((n.bit_length() + 7) // 8, "big") if n else b""
              return b"\x00" * (len(value) - len(value.lstrip("1"))) + raw

          def rpc(method, params):
              body = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req = urllib.request.Request(URL, data=body, headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  result = json.loads(response.read())
              if result.get("error"):
                  raise RuntimeError(method + " RPC error: " + json.dumps(result["error"]))
              return result.get("result")

          signatures = rpc("getSignaturesForAddress", [BUFFER, {"commitment":"finalized","limit":1000}]) or []
          signatures = [item for item in signatures if item.get("slot", 0) <= 119721738]
          signatures.sort(key=lambda item: (item.get("slot",0), item.get("blockTime") or 0))
          report = {
              "buffer": BUFFER,
              "signature_count": len(signatures),
              "signature_slots": [{"signature": x["signature"], "slot": x["slot"], "err": x.get("err")} for x in signatures],
              "write_instructions": [],
              "errors": []
          }

          def fetch_tx(item):
              try:
                  tx = rpc("getTransaction", [item["signature"], {"commitment":"finalized","encoding":"json","maxSupportedTransactionVersion":0}])
                  return item, tx, None
              except Exception as exc:
                  return item, None, str(exc)

          writes = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for item, tx, error in pool.map(fetch_tx, signatures):
                  if error:
                      report["errors"].append({"signature":item["signature"],"error":error})
                      continue
                  if not tx:
                      report["errors"].append({"signature":item["signature"],"error":"transaction unavailable"})
                      continue
                  transaction = tx.get("transaction", {})
                  message = transaction.get("message", {})
                  meta = tx.get("meta") or {}
                  keys = message.get("accountKeys", [])
                  keys = [k.get("pubkey") if isinstance(k, dict) else k for k in keys]
                  loaded = meta.get("loadedAddresses") or {}
                  all_keys = keys + loaded.get("writable", []) + loaded.get("readonly", [])
                  groups = [("outer", message.get("instructions", []))]
                  groups += [("inner", g.get("instructions", [])) for g in meta.get("innerInstructions", [])]
                  for group_name, instructions in groups:
                      for ix_index, ix in enumerate(instructions):
                          pi = ix.get("programIdIndex")
                          if pi is None or pi >= len(all_keys) or all_keys[pi] != LOADER:
                              continue
                          raw = b58decode(ix.get("data", ""))
                          if not raw or raw[0] != 1:
                              continue
                          account_indexes = ix.get("accounts", [])
                          account_keys = [all_keys[i] if i < len(all_keys) else None for i in account_indexes]
                          if not account_keys or account_keys[0] != BUFFER or len(raw) < 5:
                              continue
                          offset = struct.unpack("<I", raw[1:5])[0]
                          chunk = raw[5:]
                          writes.append((offset, chunk, item["signature"], item["slot"]))
                          report["write_instructions"].append({
                              "signature": item["signature"], "slot": item["slot"],
                              "group": group_name, "instruction_index": ix_index,
                              "offset": offset, "length": len(chunk)
                          })

          if writes:
              end = max(offset + len(chunk) for offset, chunk, _, _ in writes)
              image = bytearray(end)
              coverage = bytearray(end)
              for offset, chunk, _, _ in writes:
                  image[offset:offset+len(chunk)] = chunk
                  coverage[offset:offset+len(chunk)] = b"\x01" * len(chunk)
              raw_bytes = bytes(image)
              trimmed = raw_bytes.rstrip(b"\x00")
              report["reconstruction"] = {
                  "buffer_payload_length": end,
                  "covered_bytes": sum(coverage),
                  "gap_bytes": coverage.count(0),
                  "sha256_full_payload": hashlib.sha256(raw_bytes).hexdigest(),
                  "sha256_trimmed_trailing_zeroes": hashlib.sha256(trimmed).hexdigest(),
                  "trimmed_length": len(trimmed),
                  "write_count": len(writes)
              }
              open("reconstructed-buffer.bin", "wb").write(raw_bytes)
          else:
              report["reconstruction"] = {"status":"no Buffer Write instructions found"}

          with open("buffer-history-report.json", "w") as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          PY
          python3 reconstruct.py

      - name: Upload sanitized upgrade candidates
        uses: actions/upload-artifact@v4
        with:
          name: solana-upgrade-slot-119721738
          path: upgrade-candidates.json
          retention-days: 2
