name: Validate frontend

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/validate-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/validate-frontend.yml"

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.IGNORECASE)
          if not scripts:
              raise SystemExit("No inline JavaScript blocks found")
          Path("/tmp/frontend-check.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          print(f"Found {len(scripts)} inline JavaScript block(s)")
          PY
          node --check /tmp/frontend-check.js
