name: Cloudflare Closed Preview Cleanup

on:
  workflow_dispatch:
  # Sweep closed PR previews immediately after this workflow lands on main.
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 0"
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-closed-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Wrangler configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Verify Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Preview cleanup skipped: Cloudflare API credentials are not configured."
          fi

      - name: Collect closed pull request numbers
        if: steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            number="${{ github.event.pull_request.number }}"
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq .state)"
            if [ "$state" != "closed" ]; then
              echo "::error::Refusing cleanup because PR #$number is not closed."
              exit 1
            fi
            printf '%s\n' "$number" > "$RUNNER_TEMP/closed-prs.txt"
          else
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" --jq '.[].number' > "$RUNNER_TEMP/closed-prs.txt"
          fi
          echo "Closed PR previews selected:"
          cat "$RUNNER_TEMP/closed-prs.txt"

      - name: Delete only closed-PR Preview resources
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          failures=0
          while IFS= read -r number; do
            [ -n "$number" ] || continue
            preview="pr-$number"
            echo "Deleting isolated Preview: $preview"
            if ! npx --yes wrangler@4.135.0 preview delete --name "$preview" --worker-name solana-smart-bot-new --skip-confirmation --config wrangler.jsonc; then
              echo "::warning::Could not delete $preview (it may already be absent); continuing with remaining closed PRs."
              failures=$((failures + 1))
            fi
          done < "$RUNNER_TEMP/closed-prs.txt"
          echo "Cleanup attempted for all selected closed PR previews. Nonzero delete results: $failures"
