name: Cloudflare Closed Preview Cleanup

on:
  workflow_dispatch:
    inputs:
      execute_cleanup:
        description: "Actually delete isolated Previews for closed same-repository PRs (open PR branches are protected)"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-closed-preview-cleanup.yml'
  schedule:
    - cron: "23 3 * * 0"
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-closed-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect closed pull request branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            number="${{ github.event.pull_request.number }}"
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq .state)"
            if [ "$state" != "closed" ]; then
              echo "::error::Refusing cleanup because PR #$number is not closed."
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq '[.number, .head.ref, .head.repo.full_name, .base.ref] | @tsv' > "$RUNNER_TEMP/closed-prs.tsv"
          else
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" --jq '.[] | [.number, .head.ref, .head.repo.full_name, .base.ref] | @tsv' > "$RUNNER_TEMP/closed-prs.tsv"
          fi
          echo "Closed PR Preview candidates:"
          cat "$RUNNER_TEMP/closed-prs.tsv"

      - name: Collect open pull request branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[] | [.number, .head.ref, .head.repo.full_name] | @tsv' > "$RUNNER_TEMP/open-prs.tsv"
          echo "Open PR branches protected from deletion:"
          cat "$RUNNER_TEMP/open-prs.tsv"

      - name: Report-only cleanup plan
        run: |
          echo "REPORT ONLY: no Cloudflare resources or namespaces will be deleted."
          echo "Closed-PR Preview candidates were listed above for manual review."

      - name: Report-only mode
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              inputs.execute_cleanup != true }}
        run: |
          echo "REPORT ONLY: no Cloudflare resources were deleted."
          echo "Cleanup execution is intentionally disabled by repository safety policy."
