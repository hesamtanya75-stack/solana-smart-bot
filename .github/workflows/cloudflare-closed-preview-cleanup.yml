name: Cloudflare Closed Preview Audit (Report Only)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-closed-preview-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List closed same-repository PR Preview candidates (no Cloudflare access)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            number="${{ github.event.pull_request.number }}"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq '[.number, .state, .head.ref, .head.repo.full_name, .base.ref] | @tsv' > "$RUNNER_TEMP/closed-prs.tsv"
          else
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" --jq '.[] | [.number, .state, .head.ref, .head.repo.full_name, .base.ref] | @tsv' > "$RUNNER_TEMP/closed-prs.tsv"
          fi

          echo "## Cloudflare Preview cleanup audit — REPORT ONLY" >> "$GITHUB_STEP_SUMMARY"
          echo "No Cloudflare API, Wrangler delete, Durable Object, KV, or bot-state operation was performed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR | Branch | Candidate |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---|---|" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r number state branch source_repo base_branch; do
            [ -n "$number" ] || continue
            if [ "$state" = "closed" ] && [ "$source_repo" = "$GITHUB_REPOSITORY" ] &&
               [ -n "$branch" ] && [ "$branch" != "$base_branch" ] && [ "$branch" != "main" ] &&
               [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$branch" != *".."* ]] && [[ "$branch" != -* ]]; then
              printf '| #%s | %s | Manual review only; no deletion |\n' "$number" "$branch" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$RUNNER_TEMP/closed-prs.tsv"
          echo "Report complete. Resource deletion requires a separately reviewed, explicitly approved action."