name: Cloudflare Closed Preview Cleanup

on:
  workflow_dispatch:
  # Sweep closed PR previews immediately after this workflow lands on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-closed-preview-cleanup.yml'
  schedule:
    - cron: "23 3 * * 0"
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-closed-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Wrangler configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Verify Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Preview cleanup skipped: Cloudflare API credentials are not configured."
          fi

      - name: Collect closed pull request branches
        if: steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            number="${{ github.event.pull_request.number }}"
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq .state)"
            if [ "$state" != "closed" ]; then
              echo "::error::Refusing cleanup because PR #$number is not closed."
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq '[.number, .head.ref, .head.repo.full_name, .base.ref] | @tsv' > "$RUNNER_TEMP/closed-prs.tsv"
          else
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" --jq '.[] | [.number, .head.ref, .head.repo.full_name, .base.ref] | @tsv' > "$RUNNER_TEMP/closed-prs.tsv"
          fi
          echo "Closed PR preview branches selected:"
          cat "$RUNNER_TEMP/closed-prs.tsv"

      - name: Collect open pull request branches
        if: steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[] | [.number, .head.ref, .head.repo.full_name] | @tsv' > "$RUNNER_TEMP/open-prs.tsv"
          echo "Open PR branches protected from Preview deletion:"
          cat "$RUNNER_TEMP/open-prs.tsv"

      - name: Report closed-PR Preview candidates (no deletion)
        if: steps.credentials.outputs.available == 'true'
        run: |
          echo "SAFE MODE: Cloudflare Preview resources, Durable Object namespaces, KV, and state are preserved."
          while read -r number branch source_repo base_branch; do
            [ -n "$number" ] || continue
            if [ "$source_repo" = "$GITHUB_REPOSITORY" ] && [ -n "$branch" ] && [ "$branch" != "$base_branch" ] && [ "$branch" != "main" ]; then
              echo "Review-only candidate: PR #$number Preview branch '$branch' (legacy alias 'pr-$number'). No API deletion issued."
            fi
          done < "$RUNNER_TEMP/closed-prs.tsv"
