name: Deploy new Solana Smart Bot Worker

on:
  push:
    branches:
      - new-bot-design
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy-new-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new-bot-design
        uses: actions/checkout@v4
        with:
          ref: new-bot-design

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
