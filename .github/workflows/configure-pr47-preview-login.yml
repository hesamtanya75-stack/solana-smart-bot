name: Configure PR #47 Preview login secret

on:
  workflow_dispatch:
    inputs:
      confirm_preview_only:
        description: "Type PREVIEW-ONLY to configure the isolated PR #47 Preview"
        required: true
        type: string

permissions:
  contents: read

jobs:
  configure-preview-secret:
    if: github.ref == 'refs/heads/migration/cloudflare-only' && inputs.confirm_preview_only == 'PREVIEW-ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-only

      - name: Validate required secrets without printing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BOT_LOGIN_PASSWORD: ${{ secrets.PREVIEW_BOT_LOGIN_PASSWORD }}
        run: |
          set +x
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PREVIEW_BOT_LOGIN_PASSWORD" ]; then
            echo "::error::Missing Cloudflare credentials or PREVIEW_BOT_LOGIN_PASSWORD repository secret. No change was made."
            exit 1
          fi
          echo "::add-mask::$PREVIEW_BOT_LOGIN_PASSWORD"
          echo "Required secret inputs are present."

      - name: Set login password on PR #47 Preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BOT_LOGIN_PASSWORD: ${{ secrets.PREVIEW_BOT_LOGIN_PASSWORD }}
        run: |
          set +x
          printf '%s\n' "$PREVIEW_BOT_LOGIN_PASSWORD" | npx --yes wrangler@4.135.0 preview secret put BOT_LOGIN_PASSWORD --name pr-47 --worker-name solana-smart-bot-new --config wrangler.jsonc
          echo "Preview secret update command completed. No Production deploy was requested."
