name: Verify Solana 1.8.14 official archive and BPF SDK

on:
  push:
    branches:
      - diagnostic/solana-1.8.14-archive-verify

permissions:
  contents: read

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official Linux archive and validate release manifest
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/solana-labs/solana/releases/download/v1.8.14"
          curl --fail --location --retry 2 --retry-delay 2 --max-time 90 \
            "$base/solana-release-x86_64-unknown-linux-gnu.yml" -o /tmp/solana-release.yml
          curl --fail --location --retry 2 --retry-delay 2 --max-time 600 \
            "$base/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o /tmp/solana-release.tar.bz2
          cat /tmp/solana-release.yml
          grep -Fx 'channel: v1.8.14' /tmp/solana-release.yml
          grep -Fx 'commit: 9c01d90c709cc2208dbbfedb12705bbaee320c91' /tmp/solana-release.yml
          grep -Fx 'target: x86_64-unknown-linux-gnu' /tmp/solana-release.yml
          echo "archive_bytes=$(wc -c < /tmp/solana-release.tar.bz2)"
          echo "archive_sha256=$(sha256sum /tmp/solana-release.tar.bz2 | awk '{print $1}')"
          echo "=== BPF-related entries in release archive ==="
          tar -tjf /tmp/solana-release.tar.bz2 | grep -E 'cargo-build-bpf|sdk/bpf|platform-tools' | head -n 100 || true

      - name: Extract release and verify CLI version and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/solana-1.8.14
          tar -xjf /tmp/solana-release.tar.bz2 -C /tmp/solana-1.8.14
          solana_bin="$(find /tmp/solana-1.8.14 -type f -path '*/bin/solana' | head -n 1)"
          test -n "$solana_bin"
          echo "solana_binary=$solana_bin"
          version_output="$("$solana_bin" --version)"
          echo "$version_output"
          grep -F '1.8.14' <<< "$version_output"
          grep -F '9c01d90c' <<< "$version_output"
          echo "official_solana_cli_version_verified=true"
          echo "=== BPF tools ==="
          find /tmp/solana-1.8.14 -type f \( -name cargo-build-bpf -o -name solana-bpf-rustup \) -print
          find /tmp/solana-1.8.14 -type d \( -path '*/sdk/bpf' -o -name platform-tools \) -print

      - name: Download and inspect official BPF SDK asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 --max-time 90 \
            https://github.com/solana-labs/solana/releases/download/v1.8.14/bpf-sdk.tar.bz2 \
            -o /tmp/bpf-sdk.tar.bz2
          echo "bpf_sdk_bytes=$(wc -c < /tmp/bpf-sdk.tar.bz2)"
          echo "bpf_sdk_sha256=$(sha256sum /tmp/bpf-sdk.tar.bz2 | awk '{print $1}')"
          tar -tjf /tmp/bpf-sdk.tar.bz2 | head -n 100
