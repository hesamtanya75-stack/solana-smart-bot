name: Live Order Policy Tests

on:
  push:
    branches:
      - live-trading-readiness-prep
    paths:
      - "live-order-policy.js"
      - "live-order-units.js"
      - "live-order-lifecycle.js"
      - "live-order-ledger.js"
      - "jupiter-quote-client.js"
      - "live-order-evidence-service.js"
      - "live-order-evidence-request.js"
      - "live-order-evidence-reservation.js"
      - "worker.js"
      - "solana-signature-reconciler.js"
      - "live-order-evidence-attestation.js"
      - "tests/live-order-policy.test.mjs"
      - "tests/live-order-units.test.mjs"
      - "tests/live-order-lifecycle.test.mjs"
      - "tests/live-order-ledger.test.mjs"
      - "tests/jupiter-quote-client.test.mjs"
      - "tests/solana-signature-reconciler.test.mjs"
      - "tests/live-order-evidence-attestation.test.mjs"
      - "tests/live-order-evidence-service.test.mjs"
      - "tests/live-order-evidence-request.test.mjs tests/live-order-evidence-reservation.test.mjs"
      - "tests/live-order-evidence-reservation.test.mjs"
      - ".github/workflows/live-order-policy-tests.yml"
  pull_request:
    paths:
      - "live-order-policy.js"
      - "live-order-units.js"
      - "live-order-lifecycle.js"
      - "live-order-ledger.js"
      - "jupiter-quote-client.js"
      - "live-order-evidence-service.js"
      - "live-order-evidence-reservation.js"
      - "worker.js"
      - "solana-signature-reconciler.js"
      - "live-order-evidence-attestation.js"
      - "tests/jupiter-quote-client.test.mjs"
      - "tests/live-order-policy.test.mjs"
      - "tests/live-order-units.test.mjs"
      - "tests/live-order-lifecycle.test.mjs"
      - "tests/live-order-ledger.test.mjs"
      - "tests/solana-signature-reconciler.test.mjs"
      - "tests/live-order-evidence-attestation.test.mjs"
      - "tests/live-order-evidence-service.test.mjs"
      - "tests/live-order-evidence-reservation.test.mjs"
      - ".github/workflows/live-order-policy-tests.yml"

permissions:
  contents: read

jobs:
  policy-tests:
    name: Fail-closed order policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Worker syntax
        run: node --check worker.js
      - name: Run policy unit tests
        run: node --test tests/live-order-policy.test.mjs tests/live-order-units.test.mjs tests/live-order-lifecycle.test.mjs tests/live-order-ledger.test.mjs tests/jupiter-quote-client.test.mjs tests/solana-signature-reconciler.test.mjs tests/live-order-evidence-attestation.test.mjs tests/live-order-evidence-service.test.mjs tests/live-order-evidence-request.test.mjs
