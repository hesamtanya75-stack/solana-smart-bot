name: Devnet signed lifecycle validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_funded_devnet_lifecycle:
        description: 'Explicitly authorize the faucet-funded Devnet signing and transfer test'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  devnet-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated test dependencies
        run: npm install --no-save --ignore-scripts --package-lock=false miniflare@5.20261113.0-beta @solana/web3.js@1.98.4
      - name: Run unit and real Durable Objects runtime tests
        run: npm test
      # Read-only CI deliberately uses the script's official public Devnet
      # endpoint fallback. Do not inject the custom secret here: an invalid
      # secret hostname previously caused ENOTFOUND before RPC validation.
      - name: Verify Devnet cluster identity and read-only RPC methods
        run: node scripts/devnet-preflight.mjs
      - name: Report funded Devnet lifecycle as skipped without explicit opt-in
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_funded_devnet_lifecycle == true) }}
        run: |
          echo "::notice title=Funded Devnet lifecycle skipped::explicit workflow_dispatch opt-in is required; no faucet-funded transfer was attempted."
          node -e 'console.log(JSON.stringify({ status: "skipped", reason: "explicit workflow_dispatch opt-in is required", signing: "not performed", transactionsSubmitted: 0, userPrivateKeysUsed: false, mainnetTouched: false, swapExecuted: false }, null, 2))'
          printf '%s\n' "### Funded Devnet lifecycle: skipped" "" "Reason: explicit workflow_dispatch opt-in is required. No signing or transaction submission was attempted." >> "$GITHUB_STEP_SUMMARY"

  funded-devnet-lifecycle:
    # This isolated job is never part of pull_request runs. The secret is not
    # exposed to checkout, dependency installation, or PR test steps.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_funded_devnet_lifecycle == true }}
    needs: devnet-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Devnet lifecycle dependency
        run: npm install --no-save --ignore-scripts --package-lock=false @solana/web3.js@1.98.4
      - name: Verify dedicated RPC and submit faucet-funded Devnet test transfer
        run: node scripts/devnet-signed-lifecycle.mjs
