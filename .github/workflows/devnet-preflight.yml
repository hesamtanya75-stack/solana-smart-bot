name: Devnet signed lifecycle validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEVNET_ONLY to authorize the ephemeral-key Devnet transfer test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  devnet-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated test dependencies
        run: npm install --no-save --ignore-scripts --package-lock=false miniflare@5.20261113.0-beta @solana/web3.js@1.98.4
      - name: Run unit and real Durable Objects runtime tests
        run: npm test
      - name: Verify Devnet cluster identity and read-only RPC methods
        run: node scripts/devnet-preflight.mjs
      - name: Verify ephemeral signing and submit a faucet-funded Devnet test transfer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEVNET_ONLY' && env.DEVNET_RPC_URL != '' }}
        # Only a dedicated RPC is accepted for the funded lifecycle. The public
        # Devnet faucet may be unavailable or rate-limited and is not a CI fallback.
        run: node scripts/devnet-signed-lifecycle.mjs
      - name: Report funded Devnet lifecycle as skipped without a dedicated RPC
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEVNET_ONLY' && env.DEVNET_RPC_URL != '') }}
        run: |
          echo "::notice title=Funded Devnet lifecycle skipped::manual workflow dispatch with exact DEVNET_ONLY confirmation and DEVNET_RPC_URL is required; no transfer was attempted."
          node -e 'console.log(JSON.stringify({ status: "skipped", reason: "explicit manual dispatch confirmation and DEVNET_RPC_URL are required", signing: "not performed", transactionsSubmitted: 0, userPrivateKeysUsed: false, mainnetTouched: false, swapExecuted: false }, null, 2))'
          printf '%s\n' "### Funded Devnet lifecycle: skipped" "" "Reason: explicit manual dispatch confirmation and DEVNET_RPC_URL are required. No signing or transaction submission was attempted." >> "$GITHUB_STEP_SUMMARY"
