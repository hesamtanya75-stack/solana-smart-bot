name: Devnet signed lifecycle validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devnet-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated test dependencies
        run: npm install --no-save --ignore-scripts --package-lock=false miniflare@3 @solana/web3.js@1.98.4
      - name: Run unit and real Durable Objects runtime tests
        run: npm test
      - name: Verify Devnet cluster identity and read-only RPC methods
        env:
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
        run: node scripts/devnet-preflight.mjs
      - name: Require a dedicated Devnet RPC for the funded lifecycle test
        env:
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
        run: |
          if [ -z "$DEVNET_RPC_URL" ]; then
            echo "::error::Configure the DEVNET_RPC_URL Actions secret with a dedicated Devnet RPC that supports airdrops; the shared public RPC faucet is closed."
            exit 2
          fi
      - name: Verify ephemeral signing and submit a faucet-funded Devnet test transfer
        env:
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
        run: node scripts/devnet-signed-lifecycle.mjs
