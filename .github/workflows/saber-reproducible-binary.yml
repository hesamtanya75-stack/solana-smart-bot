name: Saber reproducible binary verification

on:
  push:
    branches:
      - live-trading-policy-enforcement
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Give each commit its own queue so an older long-running build cannot block the corrected build.
  group: saber-reproducible-binary-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compare-source-build-to-mainnet-and-devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install pinned Solana Verify CLI release and verify checksum
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          base="https://github.com/solana-foundation/solana-verifiable-build/releases/download/v0.5.2"
          curl --fail --location --silent --show-error "$base/solana-verify-0.5.2-linux" -o "$HOME/.local/bin/solana-verify"
          curl --fail --location --silent --show-error "$base/solana-verify-0.5.2-linux.sha256" -o /tmp/solana-verify.sha256
          checksum_file_sha256="e72ee837ee95c845d59065fcdb9896ea459347ef88e6d73f8f1e082ca6ce235b"
          expected_binary_sha256="b9d5ccce9634dc14269cab3e7a58649bc141b3306e7735a94478c936341f211f"
          actual_checksum_file_sha256="$(sha256sum /tmp/solana-verify.sha256 | awk '{print $1}')"
          expected_from_file="$(awk '{print $1}' /tmp/solana-verify.sha256)"
          actual_binary_sha256="$(sha256sum "$HOME/.local/bin/solana-verify" | awk '{print $1}')"
          test "$actual_checksum_file_sha256" = "$checksum_file_sha256"
          test "$expected_from_file" = "$expected_binary_sha256"
          test "$actual_binary_sha256" = "$expected_binary_sha256"
          chmod 0755 "$HOME/.local/bin/solana-verify"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          solana-verify --version

      - name: Check out pinned Saber source
        env:
          # Build the exact source revision tagged v1.8.1; v1.8.1 is the release associated with the recorded on-chain deployment.
          # a later, diverged commit and therefore could not reproduce that release.
          SABER_SOURCE_COMMIT: 6c0384cbaf305500678ed14e6426244145619249
        run: |
          git clone https://github.com/saber-hq/stable-swap.git saber-source
          git -C saber-source checkout --detach "$SABER_SOURCE_COMMIT"
          test "$(git -C saber-source rev-parse HEAD)" = "$SABER_SOURCE_COMMIT"

      - name: Pin the exact upstream Anchor 0.24.2 build image
        run: |
          set -euo pipefail
          # This is the immutable linux/amd64 digest published for
          # projectserum/build:v0.24.2 (not the v0.26.0 digest).
          image="projectserum/build@sha256:33b9c57d3cb5cafcb9349e5be034c2b1e36451b2e44531968b011c1bfc1a9cab"
          docker pull "$image"
          docker tag "$image" projectserum/build:v0.24.2
          docker image inspect projectserum/build:v0.24.2 >/dev/null
          docker run --rm projectserum/build:v0.24.2 bash -lc '
            set -euo pipefail
            solana --version
            solana --version | grep -q "^solana-cli 1\\.9\\.13 "
            command -v cargo-build-bpf
            cargo-build-bpf --help >/dev/null
            rustup toolchain list
          '

      - name: Install the exact Saber Anchor release toolchain
        uses: cachix/install-nix-action@v22

      - name: Reproducible build using Saber upstream release command
        working-directory: saber-source
        run: |
          set -euo pipefail
          # Saber v0.24.2's own release workflow uses:
          # nix shell .#ci --command anchor build --verifiable --program-name stable_swap
          # The exact upstream v0.24.2 image was pulled by immutable digest
          # and tagged with the name Anchor 0.24.2 expects.
          nix shell .#ci --command anchor --version | grep -q "anchor-cli 0.24.2"
          nix shell .#ci --command anchor build --verifiable --program-name stable_swap
          mapfile -t built_binaries < <(find target -type f -name stable_swap.so -print)
          printf "Found %s stable_swap.so build artifact(s):\\n" "${#built_binaries[@]}"
          printf "%s\\n" "${built_binaries[@]}"
          test "${#built_binaries[@]}" -eq 1
          test -s "${built_binaries[0]}"
          solana-verify get-executable-hash "${built_binaries[0]}" | tee ../executable-hash.txt

      - name: Hash the published upstream v1.8.1 release binary
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/saber-hq/stable-swap/releases/download/v1.8.1/stable_swap.so -o /tmp/upstream-stable_swap-v1.8.1.so
          solana-verify get-executable-hash /tmp/upstream-stable_swap-v1.8.1.so | tee upstream-executable-hash.txt

      - name: Compare built executable with Mainnet and Devnet
        id: compare
        working-directory: saber-source
        shell: bash
        run: |
          set -euo pipefail
          executable_hash="$(grep -Eo '[a-f0-9]{64}' ../executable-hash.txt | tail -n 1)"
          upstream_hash="$(grep -Eo '[a-f0-9]{64}' ../upstream-executable-hash.txt | tail -n 1)"
          test -n "$executable_hash"
          test -n "$upstream_hash"
          echo "Rebuilt Saber hash: $executable_hash"
          echo "Published upstream Saber v1.8.1 hash: $upstream_hash"
          if [ "$executable_hash" != "$upstream_hash" ]; then
            echo "::error::Rebuilt Saber binary does not match the published upstream v1.8.1 artifact"
            exit 1
          fi

          solana-verify get-program-hash -u https://api.mainnet-beta.solana.com SSwpkEEcbUqx4vtoEByFjSkhKdCT862DNVb52nZg1UZ | tee ../mainnet-hash.txt
          solana-verify get-program-hash -u https://api.devnet.solana.com SSwpkEEcbUqx4vtoEByFjSkhKdCT862DNVb52nZg1UZ | tee ../devnet-hash.txt

          mainnet_hash="$(grep -Eo '[a-f0-9]{64}' ../mainnet-hash.txt | tail -n 1)"
          devnet_hash="$(grep -Eo '[a-f0-9]{64}' ../devnet-hash.txt | tail -n 1)"
          test -n "$mainnet_hash"
          test -n "$devnet_hash"

          mainnet_match=false
          devnet_match=false
          if [ "$executable_hash" = "$mainnet_hash" ]; then mainnet_match=true; fi
          if [ "$executable_hash" = "$devnet_hash" ]; then devnet_match=true; fi
          echo "mainnet_match=$mainnet_match" >> "$GITHUB_OUTPUT"
          echo "devnet_match=$devnet_match" >> "$GITHUB_OUTPUT"

          {
            echo "## Saber source-to-binary comparison"
            echo "- Source commit (v1.8.1 tag): 6c0384cbaf305500678ed14e6426244145619249"
            echo "- Solana Verify CLI: 0.5.2 (release checksum verified); Docker base digest pinned; Rust 1.59.0 and Solana CLI/BPF SDK 1.9.13 checked in-image"
            echo "- Rebuilt executable hash: $executable_hash"
            echo "- Published upstream v1.8.1 executable hash: $upstream_hash (match: true)"
            echo "- Mainnet program hash: $mainnet_hash (match: $mainnet_match)"
            echo "- Devnet program hash: $devnet_hash (match: $devnet_match)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js for Devnet integration tests
        if: steps.compare.outputs.devnet_match == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run positive and negative Saber integration tests on Devnet
        id: devnet-e2e
        if: steps.compare.outputs.devnet_match == 'true'
        working-directory: saber-source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const helperPath = "stable-swap-program/sdk/test/helpers.ts";
          let helpers = readFileSync(helperPath, "utf8");
          const localUrl = 'export const CLUSTER_URL = "http://localhost:8899";';
          if (!helpers.includes(localUrl)) throw new Error("Pinned Saber test helper URL changed");
          helpers = helpers.replace(localUrl, 'export const CLUSTER_URL = "https://api.devnet.solana.com";');
          writeFileSync(helperPath, helpers);

          const testPath = "stable-swap-program/sdk/test/e2e.int.test.ts";
          let tests = readFileSync(testPath, "utf8");
          const marker = "\n});\n";
          const insertAt = tests.lastIndexOf(marker);
          if (insertAt < 0) throw new Error("Could not locate the outer Saber e2e test suite boundary");
          const negativeTest = `
            it("rejects an impossible minimum output and leaves all token balances unchanged", async () => {
              const amountIn = 100000;
              const userSource = await mintA.createAccount(owner.publicKey);
              await mintA.mintTo(userSource, owner, [], amountIn);
              const userDestination = await mintB.createAccount(owner.publicKey);
              await sleep(500);

              const sourceBefore = await mintA.getAccountInfo(userSource);
              const reserveABefore = await mintA.getAccountInfo(tokenAccountA);
              const reserveBBefore = await mintB.getAccountInfo(tokenAccountB);
              const destinationBefore = await mintB.getAccountInfo(userDestination);
              const adminFeeBefore = await mintB.getAccountInfo(adminFeeAccountB);

              const transaction = new Transaction().add(stableSwap.swap({
                userAuthority: owner.publicKey,
                userSource,
                poolSource: tokenAccountA,
                poolDestination: tokenAccountB,
                userDestination,
                amountIn: new u64(amountIn),
                minimumAmountOut: new u64(1000000000000),
              }));

              let rejectionText = "";
              try {
                await sendAndConfirmTransactionWithTitle("expected slippage rejection", connection, transaction, payer, owner);
              } catch (error) {
                rejectionText = [String(error), ...((error as { logs?: string[] } | undefined)?.logs ?? [])].join(String.fromCharCode(10));
              }
              expect(rejectionText).toMatch(/Swap instruction exceeds desired slippage limit|custom program error: 0x11/i);

              const sourceAfter = await mintA.getAccountInfo(userSource);
              const reserveAAfter = await mintA.getAccountInfo(tokenAccountA);
              const reserveBAfter = await mintB.getAccountInfo(tokenAccountB);
              const destinationAfter = await mintB.getAccountInfo(userDestination);
              const adminFeeAfter = await mintB.getAccountInfo(adminFeeAccountB);
              expect(sourceAfter.amount.toString()).toBe(sourceBefore.amount.toString());
              expect(reserveAAfter.amount.toString()).toBe(reserveABefore.amount.toString());
              expect(reserveBAfter.amount.toString()).toBe(reserveBBefore.amount.toString());
              expect(destinationAfter.amount.toString()).toBe(destinationBefore.amount.toString());
              expect(adminFeeAfter.amount.toString()).toBe(adminFeeBefore.amount.toString());
            });
          `;
          tests = tests.slice(0, insertAt) + String.fromCharCode(10) + negativeTest + tests.slice(insertAt);
          writeFileSync(testPath, tests);
          NODE
          yarn --cwd stable-swap-program/sdk install --frozen-lockfile --non-interactive
          yarn --cwd stable-swap-program/sdk jest test/e2e.int.test.ts --runInBand --forceExit --testTimeout=30000

      - name: Enforce Saber verification gates
        if: always()
        env:
          MAINNET_MATCH: ${{ steps.compare.outputs.mainnet_match }}
          DEVNET_MATCH: ${{ steps.compare.outputs.devnet_match }}
          DEVNET_E2E_OUTCOME: ${{ steps.devnet-e2e.outcome }}
        run: |
          test "$MAINNET_MATCH" = true
          test "$DEVNET_MATCH" = true
          test "$DEVNET_E2E_OUTCOME" = success
