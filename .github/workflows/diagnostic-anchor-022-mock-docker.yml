name: Diagnose Anchor 0.22.0 verifiable build invocation with mocked Docker

on:
  push:
    branches:
      - diagnostic/anchor-022-mock-docker
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-anchor022-docker-invocation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Report exact Anchor CLI version and build options
        shell: bash
        run: |
          set -euo pipefail
          nix shell .#ci --command bash -lc '
            set -euo pipefail
            anchor --version
            anchor build --help | tee /tmp/anchor-build-help.txt
            grep -E -- "--docker-image|--verifiable|--program-name" /tmp/anchor-build-help.txt
          '

      - name: Run minimal workspace probes with Docker replaced by a logger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mock-bin /tmp/anchor-probe/programs/dummy/src
          cat > /tmp/mock-bin/docker <<'DOCKER_MOCK'
          #!/usr/bin/env bash
          set -u
          {
            printf 'docker_call='
            printf '%q ' "$@"
            printf '\n'
          } >> "${DOCKER_LOG:?}"
          # Deliberately do not run a container or any build.
          exit 0
          DOCKER_MOCK
          chmod +x /tmp/mock-bin/docker

          cat > /tmp/anchor-probe/Cargo.toml <<'CARGO'
          [workspace]
          members = ["programs/dummy"]
          anchor_version = "0.22.0"
          ANCHOR
            if [ "$include_solana" = "yes" ]; then
              echo 'solana_version = "1.8.14"' >> /tmp/anchor-probe/Anchor.toml
            fi
            echo "=== probe: $label ==="
            (cd /tmp/anchor-probe && PATH="/tmp/mock-bin:$PATH" DOCKER_LOG="$log" nix shell "$GITHUB_WORKSPACE#ci" --command anchor build --verifiable --program-name dummy --docker-image saber-anchor022-solana1814-preloaded) || true
            if [ -f "$log" ]; then
              cat "$log"
            else
              echo "NO_DOCKER_CALL_CAPTURED"
            fi
          }

          run_probe "with-solana-version" "yes"
          run_probe "without-solana-version" "no"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-022-mock-docker-diagnostic
          path: |
            /tmp/anchor-build-help.txt
            /tmp/with-solana-version.docker.log
            /tmp/without-solana-version.docker.log
          if-no-files-found: warn
          retention-days: 7
