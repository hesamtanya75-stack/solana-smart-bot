name: Diagnose Anchor 0.22.0 CLI with mock Docker (no Saber build)

on:
  push:
    branches:
      - diagnostic/anchor-022-mock-docker
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-anchor022-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Saber v1.7.2 source and build configuration
        uses: actions/checkout@v4
        with:
          repository: saber-hq/stable-swap
          ref: v1.7.2
          path: stable-swap

      - name: Install Nix on GitHub runner
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only the pinned Anchor 0.22.0 CLI from Saber lockfile
        shell: bash
        working-directory: stable-swap
        run: |
          set -euo pipefail
          mkdir -p /tmp/anchor-only
          cp flake.lock /tmp/anchor-only/flake.lock
          cat > /tmp/anchor-only/flake.nix <<'EOF'
          {
            description = "Minimal pinned Anchor 0.22.0 CLI validation";
            inputs = {
              nixpkgs.url = "github:NixOS/nixpkgs/nixpkgs-unstable";
              saber-overlay.url = "github:saber-hq/saber-overlay";
              flake-utils.url = "github:numtide/flake-utils";
            };
            outputs = { self, saber-overlay, ... }: {
              packages.x86_64-linux.default =
                saber-overlay.packages.x86_64-linux.anchor-0_22_0;
            };
          }
          EOF
          nix flake show /tmp/anchor-only
          nix shell /tmp/anchor-only#packages.x86_64-linux.default --command bash -lc '
            set -euo pipefail
            anchor --version | tee /tmp/anchor-version.txt
            grep -F "anchor-cli 0.22.0" /tmp/anchor-version.txt
            anchor build --help | tee /tmp/anchor-build-help.txt
            grep -E -- "--docker-image|--verifiable|--program-name" /tmp/anchor-build-help.txt
          '
          cp /tmp/anchor-version.txt "$GITHUB_WORKSPACE/"
          cp /tmp/anchor-build-help.txt "$GITHUB_WORKSPACE/"

      - name: Confirm exact source-level installer guard and image override
        shell: bash
        working-directory: stable-swap
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.22.0 https://github.com/project-serum/anchor.git /tmp/anchor-v022
          cd /tmp/anchor-v022
          grep -n -B 5 -A 10 'docker_image: Option<String>' cli/src/lib.rs
          grep -n -B 5 -A 10 'docker_image.unwrap_or_else(|| cfg.docker())' cli/src/lib.rs
          grep -n -B 5 -A 22 'if let Some(solana_version) = &build_config.solana_version' cli/src/lib.rs
          grep -q 'docker_image.unwrap_or_else(|| cfg.docker())' cli/src/lib.rs
          grep -q 'if let Some(solana_version) = &build_config.solana_version' cli/src/lib.rs
          grep -q 'https://release.solana.com/v{0}/install' cli/src/lib.rs
          echo "anchor_022_cli_source_contract=PASS"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-022-cli-no-build-diagnostic
          path: |
            anchor-version.txt
            anchor-build-help.txt
          if-no-files-found: warn
          retention-days: 7
