<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Sanity</title><style>
html,body{margin:0;min-height:100%;background:#060914;color:#f6f7ff;font-family:system-ui,sans-serif}
body{padding:12px}
header,.panel,.card{padding:16px;margin:0 0 12px;border:1px solid #5740a7;border-radius:16px;background:linear-gradient(120deg,#17103d,#0a1b35)}
header{font-size:22px}.panel{border-color:#20e6d0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{margin:0;background:#111b34;border-color:#284a7b}
</style></head><body><header>🔎 پشکنەری زیرەکی کۆینی سولانا 🚀</header><section class="panel">پەڕەی تاقیکردنەوەی CSS</section><div class="grid"><section class="card">دۆخی بازاڕ</section><section class="card">پشکنینی سەلامەتی</section></div></body></html>
