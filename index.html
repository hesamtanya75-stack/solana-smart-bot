<script>
const RPCS=[
 "https://api.mainnet-beta.solana.com",
 "https://solana-rpc.publicnode.com"
];

function el(id){return document.getElementById(id)}
function show(id,value){el(id).innerHTML=value}
function row(label,value){
 return `<div class="item"><span>${label}</span><b class="value">${value}</b></div>`;
}
function safe(v){
 return String(v??"نەزانراو").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function money(v){
 return v==null||!Number.isFinite(Number(v))||Number(v)<=0
 ?"نەزانراو":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:8});
}
function number(v){
 return v==null?"نەزانراو":Number(v).toLocaleString("en-US");
}
function short(s){
 return s?s.slice(0,6)+"..."+s.slice(-6):"نەزانراو";
} 

async function getJSON(url,options={}){
 const controller = new AbortController();
 const timer = setTimeout(() => controller.abort(), 10000);

 try {
  const r = await fetch(url,{
   ...options,
   signal: controller.signal
  });

  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();

 } catch(e) {
  if(e.name === "AbortError") {
   throw new Error("کاتی چاوەڕوانی سێرڤەر تەواو بوو.");
  }
  throw e;
 } finally {
  clearTimeout(timer);
 }
}
 

let rpcQueue = Promise.resolve();

async function rpcRequest(method,params){
  let lastError;

  for(const endpoint of RPCS){
    for(let attempt=0;attempt<2;attempt++){
      try{
        const j=await getJSON(endpoint,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            jsonrpc:"2.0",
            id:1,
            method,
            params
          })
        });

        if(j.error) throw new Error(j.error.message);
        return j.result;

      }catch(e){
        lastError=e;

        if(!String(e.message).includes("429")) break;

        await new Promise(resolve =>
          setTimeout(resolve,2000)
        );
      }
    }
  }

  throw lastError||new Error("RPC unavailable");
}

function rpc(method,params){
  const request=rpcQueue.then(() =>
    rpcRequest(method,params)
  );

  rpcQueue=request.catch(()=>{});

  return request;
}
async function discoverTokens() {
  const btn = document.getElementById("autoDiscover");
  const status = document.getElementById("discoverStatus");
  const list = document.getElementById("discoverList");

  btn.disabled = true;
  status.textContent = "لە دۆزینەوەی کۆینەکان دام...";
  list.replaceChildren();

  try {
    const response = await fetch(
      "https://api.dexscreener.com/token-profiles/latest/v1"
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    const tokens = Array.isArray(data)
      ? data.filter(t =>
          t.chainId === "solana" && t.tokenAddress
        ).slice(0, 10)
      : [];

    if (!tokens.length) {
      status.textContent = "هیچ پڕۆفایلی کۆینی Solana نەدۆزرایەوە.";
      return;
    }

    tokens.forEach(t => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent =
        (t.description || "کۆینی نوێ") +
        " — " + t.tokenAddress.slice(0, 8) + "...";

      button.onclick = () => {
        document.getElementById("mint").value = t.tokenAddress;
        status.textContent = "✅ ناونیشانی کۆین دانرا.";
        scanToken();
      };

      list.appendChild(button);
    });

    status.textContent =
      "✅ " + tokens.length + " پڕۆفایلی کۆینی Solana دۆزرایەوە.";

  } catch (e) {
    status.textContent = "هەڵە لە دۆزینەوە: " + e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("autoDiscover")
  .addEventListener("click", discoverTokens);
async function scanToken(){
 window.demoBuyAllowed=false;
 window.demoBuyBlockReasons=["پشکنین تەواو نییە."];
 const mint=el("mint").value.trim();

 if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(mint)){
  el("status").textContent="تکایە ناونیشانی دروستی کۆین بنووسە.";
  return;
 }

 el("scan").disabled=true;
 el("status").textContent="لە پشکنین دام... تکایە چاوەڕێ بکە";
 el("result").style.display="none";

 try{
  let risk=0,notes=[],market=null,rug=null;
  let mintInfo=null,mintRawInfo=null,holderData=null,supplyData=null;

  const tasks=await Promise.allSettled([
  getJSON("https://api.dexscreener.com/latest/dex/tokens/"+mint),
  getJSON("https://api.rugcheck.xyz/v1/tokens/"+mint+"/report"),
  rpc("getAccountInfo",[mint,{encoding:"jsonParsed",commitment:"confirmed"}]),
  rpc("getTokenLargestAccounts",[mint,{commitment:"confirmed"}]),
  rpc("getTokenSupply",[mint,{commitment:"confirmed"}]),
  rpc("getAccountInfo",[mint,{encoding:"base64",commitment:"confirmed"}])
].map(p =>
  Promise.race([
    p,
    new Promise((_,reject) =>
      setTimeout(() => reject(new Error("کاتی پشکنین تەواو بوو")),12000)
    )
  ])
));

  if(tasks[0].status==="fulfilled"){
   const pairs=tasks[0].value.pairs||[];
   market=pairs.filter(p=>p.chainId==="solana")
    .sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0]||null;
  }

  if(tasks[1].status==="fulfilled")rug=tasks[1].value;
  if(tasks[2].status==="fulfilled")mintInfo=tasks[2].value?.value;
  if(tasks[3].status==="fulfilled")holderData=tasks[3].value?.value;
  if(tasks[4].status==="fulfilled")supplyData=tasks[4].value?.value;
if(tasks[5].status==="fulfilled")mintRawInfo=tasks[5].value?.value;
 let tokenExtensions=[];
try{
  const raw=mintRawInfo?.data;
  if(Array.isArray(raw)&&typeof raw[0]==="string"){
    const bytes=Uint8Array.from(atob(raw[0]),c=>c.charCodeAt(0));
    if(bytes.length>=166){
      let offset=166;
      while(offset+4<=bytes.length){
        const type=bytes[offset]|(bytes[offset+1]<<8);
        const len=bytes[offset+2]|(bytes[offset+3]<<8);
        if(type===0&&len===0)break;
        if(offset+4+len>bytes.length)break;
        tokenExtensions.push(type);
        offset+=4+len;
      }
    }
  }
}catch(e){}

const extensionNames={
  1:"Transfer Fee — کرێی گواستنەوە",
  3:"Mint Close Authority",
  4:"Confidential Transfer",
  6:"Default Account State — دۆخی بنەڕەتی هەژمار",
  9:"Non-Transferable — نەتوانینی گواستنەوە",
  10:"Interest Bearing — سوودی تۆکن",
  12:"Permanent Delegate — دەسەڵاتی هەمیشەیی",
  14:"Transfer Hook — کۆدی تایبەت لە گواستنەوە",
  18:"Metadata Pointer",
  19:"Token Metadata",
  20:"Group Pointer",
  21:"Token Group",
  22:"Group Member Pointer",
  23:"Token Group Member",
  24:"Confidential Mint-Burn",
  25:"Scaled UI Amount",
  26:"Pausable — توانای وەستاندنی مامەڵە",
  28:"Permissioned Burn"
};
const riskyExtensionTypes=[6,9,12,14,26];

const riskyExtensions=tokenExtensions.filter(
  type=>riskyExtensionTypes.includes(type)
);
const foundExtensions=tokenExtensions.map(
  type=>extensionNames[type]||("Extension "+type)
); 

const name=market?.baseToken?.name||"کۆینی نەناسراو";
  window.lastTokenPrice = Number(market?.priceUsd || 0);const symbol=market?.baseToken?.symbol||"---";
  el("coinName").textContent=name+" ("+symbol+")";

  if(!market){
   risk+=3;
   notes.push("زانیاری بازاڕ بەردەست نییە");
  }else{
   if((market.liquidity?.usd||0)<5000){
    risk+=3;
    notes.push("لیکوییدیتی زۆر کەمە");
   }else if(market.liquidity.usd<20000){
    risk+=1;
    notes.push("لیکوییدیتی مامناوەندە");
   }

   if((market.volume?.h24||0)<1000){
    risk+=2;
    notes.push("قەبارەی مامەڵەی ٢٤ کاتژمێر کەمە");
   }
  }

  const mintData=mintInfo?.data;
const rawMintData=mintRawInfo?.data;

let mintAuth=null;
let freezeAuth=null;
let mintChecked=false;

if(mintData?.parsed?.info){
  mintAuth=!!mintData.parsed.info.mintAuthority;
  freezeAuth=!!mintData.parsed.info.freezeAuthority;
  mintChecked=true;

}else if(Array.isArray(rawMintData)&&typeof rawMintData[0]==="string"){
  try{
    const bytes=Uint8Array.from(
      atob(rawMintData[0]),
      c=>c.charCodeAt(0)
    );

    if(bytes.length>=82){
      const readU32=(i)=>(
        bytes[i]|(bytes[i+1]<<8)|(bytes[i+2]<<16)|(bytes[i+3]<<24)
      );

      const mintOption=readU32(0);
      const freezeOption=readU32(46);

      if(mintOption<=1&&freezeOption<=1){
        mintAuth=mintOption===1;
        freezeAuth=freezeOption===1;
        mintChecked=true;
      }
    }
  }catch(e){}
}

const programOwner=mintInfo?.owner;
const rpcErrors = [2,5]
  .filter(i => tasks[i].status === "rejected")
  .map(i => "RPC " + i + ": " +
    (tasks[i].reason?.message || "هەڵەی نەناسراو")
  );

const rpcDiagnostic = rpcErrors.length
  ? rpcErrors.join(" | ")
  : "RPC وەڵامی داوە";
let mintStatus="داتا نییە";
let freezeStatus="داتا نییە";

if(!mintChecked){
  risk+=2;
  notes.push("پشکنینی Mint و Freeze بەردەست نەبوو");
}else{
  mintStatus=mintAuth?"چالاک ⚠️":"ناچالاک ✅";
  freezeStatus=freezeAuth?"چالاک ⚠️":"ناچالاک ✅";

  if(mintAuth){
    risk+=3;
    notes.push("Mint Authority چالاکە");
  }
  if(freezeAuth){
    risk+=3;
    notes.push("Freeze Authority چالاکە");
  }
}
         show("security",
    row("Mint Authority",mintStatus)+
    row("Freeze Authority",freezeStatus)+
    row("Token Program",programOwner||"داتا نییە")+
row("Token-2022 Extensions",
  foundExtensions.length
    ? foundExtensions.join("، ")
    : "هیچ Extension ـێک نەدۆزرایەوە"
)+    (rpcErrors.length
      ? row("هەڵەی RPC",safe(rpcDiagnostic))
      : "")+
    (mintStatus==="داتا نییە" || freezeStatus==="داتا نییە"
      ? "<p class='bad'><b>⚠️ ئاگاداری: دۆخی Mint و Freeze پشتڕاست نەکراوەتەوە.</b></p>"
      : "")
  );

  if(!rug){
    risk+=2;
    notes.push("داتای RugCheck بەردەست نەبوو");
  }else if(rug.score!=null){
    if(rug.score>5000){
      risk+=3;
      notes.push("نمرەی مەترسی RugCheck بەرزە");
    }else if(rug.score>2500){
      risk+=2;
      notes.push("نمرەی مەترسی RugCheck مامناوەندە");
    }
  }

    let holderText="داتای خاوەنەکان بەردەست نییە";
  let largestText="نەزانراو";
  let topTenText="نەزانراو";
  let holderCount="نەزانراو";
  let holders=[];

  const total=Number(supplyData?.amount);

  if(Array.isArray(holderData)&&holderData.length&&total>0){
        holders=holderData.slice(0,10).map(x=>({
      address:x.address||"نەزانراو",
      owner:null,
      insider:null,
      pct:Number(x.amount)/total*100
    })).filter(x=>Number.isFinite(x.pct));

    holderCount=holderData.length;
    holderText="داتا لە RPC وەرگیرا";
  }

        if(!holders.length&&Array.isArray(rug?.topHolders)&&rug.topHolders.length){
    holders=rug.topHolders.slice(0,10).map(x=>({
      address:x.address||"نەزانراو",
      owner:x.owner||null,
      insider:x.insider??null,
      pct:Number(x.pct)
    })).filter(x=>Number.isFinite(x.pct));

    holderCount=rug.topHolders.length;
    holderText="داتا لە RugCheck وەرگیرا";
  }

  if(holders.length){
    const largest=Math.max(...holders.map(x=>x.pct));
    const topTen=holders.reduce((sum,x)=>sum+x.pct,0);

    largestText=largest.toFixed(2)+"%";
    topTenText=topTen.toFixed(2)+"%";

    if(largest>30){
      risk+=2;
      notes.push("گەورەترین هەژماری تۆکن بەشی زۆری هەیە");

      if(Number(market?.liquidity?.usd||0)<5000){
        risk+=2;
        notes.push("مەترسی زۆر بەرزە: کۆبوونەوەی زۆری کۆین لە یەک هەژمار و لیکوییدیتی زۆر کەم");
      }
    }else if(topTen>50){
      risk+=2;
      notes.push("١٠ هەژماری گەورەتر بەشی زۆریان هەیە");
    }
  }

  show("holders",
    row("دۆخی داتا",holderText)+
    row("گەورەترین هەژماری تۆکن",largestText)+
    row("کۆی ١٠ هەژماری گەورەتر",topTenText)+

function renderDemoHistory() {
  const box = document.getElementById("demoHistory");

  const profitTrades = [];
  const lossTrades = [];
  const openTrades = [];

  demoTrades.forEach(t => {
    const buy = Number(t.amount || 0);
    const price = Number(t.sold ? t.sellPrice : (t.currentPrice || t.buyPrice));
    const value = Number(t.sold
      ? (t.saleValue ?? t.tokens * price)
      : t.tokens * price);
    const profit = Number((value - buy).toFixed(2));

    if (!t.sold) openTrades.push({t, profit});
    else if (profit >= 0) profitTrades.push({t, profit});
    else lossTrades.push({t, profit});
  });

  function makeCards(items) {
    if (!items.length) return "<p>هیچ مامەڵەیەک نییە.</p>";

    return items.map(({t, profit}) => `
      <div class="item">
        <p>🪙 کڕین: $${Number(t.amount).toFixed(2)}</p>
        <p>ناونیشان: <span dir="ltr">${String(t.mint).replace(/[&<>"']/g,"")}</span></p>
        <p>قازانج / زیان: 
          <b>${profit >= 0 ? "+" : "-"}$${Math.abs(profit).toFixed(2)}</b>
        </p>
        <p>بەهای فرۆشتن: $${Number(t.saleValue ?? t.tokens * t.sellPrice).toFixed(2)}</p>
        <p>✅ فرۆشراوە</p>
      </div>
    `).join("");
  }

  const totalProfit = profitTrades.reduce((s,x) => s + x.profit, 0);
  const totalLoss = lossTrades.reduce((s,x) => s + Math.abs(x.profit), 0);

  box.innerHTML = `
    <section class="section">
      <h2 style="color:#48e5a5">🟢 قازانج</h2>
      <h3>کۆی قازانج: +$${totalProfit.toFixed(2)}</h3>
      ${makeCards(profitTrades)}
    </section>

    <section class="section">
      <h2 style="color:#ff7777">🔴 زیان</h2>
      <h3>کۆی زیان: -$${totalLoss.toFixed(2)}</h3>
      ${makeCards(lossTrades)}
    </section>

    <section class="section">
      <h2>⏳ مامەڵە کراوەکان</h2>
      ${openTrades.length ? makeCards(openTrades) : "<p>هیچ مامەڵەیەکی کراوە نییە.</p>"}
    </section>
  `;
}

async function refreshDemoPrice() {
  if (refreshDemoPrice.running) return;
  refreshDemoPrice.running = true;

  let soldCount = 0;

  try {
    const openTrades = demoTrades.filter(t => !t.sold);

    for (const trade of openTrades) {
      if (trade.sold) continue;

      try {
        const data = await getJSON(
          "https://api.dexscreener.com/latest/dex/tokens/" +
          encodeURIComponent(trade.mint)
        );

        const market = (data.pairs || [])
          .filter(p => p.chainId === "solana")
          .sort((a, b) =>
            (b.liquidity?.usd || 0) -
            (a.liquidity?.usd || 0)
          )[0];

        const price = Number(market?.priceUsd || 0);
        if (price <= 0) continue;

        trade.currentPrice = price;

        if (
          price >= trade.buyPrice * 1.10 ||
          price <= trade.buyPrice * 0.95
        ) {
          const saleValue = Number(
            (trade.tokens * price).toFixed(2)
          );

          demoBalance = Number(
            (demoBalance + saleValue).toFixed(2)
          );

          trade.sold = true;
          trade.sellPrice = price;
          trade.saleValue = saleValue;
          soldCount++;
        }
      } catch (e) {}
    }

    saveDemoState();

    document.getElementById("demoBalance").innerText =
      "$" + demoBalance.toFixed(2);

    if (soldCount > 0) {
      document.getElementById("demoStatus").innerText =
        "✅ فرۆشتنی خەیاڵی تەواو بوو. ژمارە: " +
        soldCount;

      renderDemoHistory();
    }
renderDemoHistory();
    updateDemoProfit();

  } finally {
    refreshDemoPrice.running = false;
  }
}

function updateDemoStats() {
  const sold = demoTrades.filter(t => t.sold);
  const wins = sold.filter(t =>
    Number(t.saleValue ?? t.tokens * t.sellPrice) > Number(t.amount)
  );
  const losses = sold.filter(t =>
    Number(t.saleValue ?? t.tokens * t.sellPrice) < Number(t.amount)
  );

  const net = sold.reduce((sum,t) =>
    sum + Number(t.saleValue ?? t.tokens * t.sellPrice) - Number(t.amount), 0
  );

  const rate = sold.length
    ? (wins.length / sold.length * 100).toFixed(1)
    : "0.0";

  statsBox.innerHTML = `
    <h2>📊 ئاماری ئەدای بۆت</h2>
    <p>کۆی مامەڵەکان: <b>${demoTrades.length}</b></p>
    <p>ژمارەی کڕینەکان: <b>${demoTrades.length}</b></p>
    <p>ژمارەی فرۆشتنەکان: <b>${sold.length}</b></p>
    <p>🟢 مامەڵە قازانجدارەکان: <b>${wins.length}</b></p>
    <p>🔴 مامەڵە زیان‌دارەکان: <b>${losses.length}</b></p>
    <p>ڕێژەی سەرکەوتن: <b>${rate}%</b></p>
    <h3>کۆی قازانج / زیانی تەواوکراو:
      <b style="color:${net >= 0 ? '#48e5a5' : '#ff7777'}">
        ${net >= 0 ? '+' : '-'}$${Math.abs(net).toFixed(2)}
      </b>
    </h3>
  `;
}
