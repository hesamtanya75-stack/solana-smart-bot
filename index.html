
<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<meta charset="UTF-8">

<style>
*{box-sizing:border-box}

.value{direction:ltr;text-align:left;overflow-wrap:anywhere}
.good{color:#60e6a8}.bad{color:#ff7777}.warn{color:#ffd166}

#status{margin-top:12px;text-align:center;color:#ffd166}
</style>
</head>
<body>
<main>
<header>
<h1>🔎 پشکنەری زیرەکی کۆینی سولانا</h1>
<p>پشکنینی لیکوییدیتی، خاوەنەکان و مەترسی</p>
</header>

<div class="panel">
<h2>ناونیشانی کۆین</h2>
<input id="mint" placeholder="ناونیشانی Mint لێرە دابنێ" autocomplete="off">
<button id="scan" onclick="scanToken()">پشکنینی کۆین</button>
<div id="status"></div>
</div>

<div id="result" style="display:none">
<div class="section">
<h2 id="coinName">زانیاری کۆین</h2>
<div id="risk"></div>
<div id="basic"></div>
</div>

<div class="section">
<h2>📊 دۆخی بازاڕ</h2>
<div id="market"></div>
</div>

<div class="section">
<h2>🛡️ پشکنینی سەلامەتی</h2>
<div id="security"></div>
</div>

<div class="section">
<h2>👥 دابەشبوونی خاوەنەکان</h2>
<div id="holders"></div>
</div>

<div class="section">
<h2>💱 توانای فرۆشتن</h2>
<div id="selling"></div>
</div>

<div class="section">
<h2>⚠️ کۆتایی هەڵسەنگاندن</h2>
<div id="conclusion"></div>
</div>
</div>

<p class="small">تێبینی: هیچ پشکنینێک دڵنیایی تەواو نادات. ئەم بۆتە هیچ مامەڵەیەک ناکات و هیچ واژۆیەکت ناوێت.</p>
</main>

<script>
const RPCS=[
 "https://api.mainnet-beta.solana.com",
 "https://solana-rpc.publicnode.com"
];

function el(id){return document.getElementById(id)}
function show(id,value){el(id).innerHTML=value}
function row(label,value){
 return `<div class="item"><span>${label}</span><b class="value">${value}</b></div>`;
}
function safe(v){
 return String(v??"نەزانراو").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function money(v){
 return v==null||!Number.isFinite(Number(v))||Number(v)<=0
 ?"نەزانراو":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:8});
}
function number(v){
 return v==null?"نەزانراو":Number(v).toLocaleString("en-US");
}
function short(s){
 return s?s.slice(0,6)+"..."+s.slice(-6):"نەزانراو";
}

async function getJSON(url,options={}){
 const r=await fetch(url,options);
 if(!r.ok)throw new Error("HTTP "+r.status);
 return r.json();
}

async function rpc(method,params){
 let lastError;
 for(const endpoint of RPCS){
  try{
   const j=await getJSON(endpoint,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     jsonrpc:"2.0",id:1,method,params
    })
   });
   if(j.error)throw new Error(j.error.message);
   return j.result;
  }catch(e){
   lastError=e;
  }
 }
 throw lastError||new Error("RPC unavailable");
}

async function scanToken(){
 const mint=el("mint").value.trim();

 if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(mint)){
  el("status").textContent="تکایە ناونیشانی دروستی کۆین بنووسە.";
  return;
 }

 el("scan").disabled=true;
 el("status").textContent="لە پشکنین دام... تکایە چاوەڕێ بکە";
 el("result").style.display="none";

 try{
  let risk=0,notes=[],market=null,rug=null;
  let mintInfo=null,mintRawInfo=null,holderData=null,supplyData=null;

  const tasks=await Promise.allSettled([
   getJSON("https://api.dexscreener.com/latest/dex/tokens/"+mint),
   getJSON("https://api.rugcheck.xyz/v1/tokens/"+mint+"/report"),
   rpc("getAccountInfo",[mint,{encoding:"jsonParsed",commitment:"confirmed"}]),
   rpc("getTokenLargestAccounts",[mint,{commitment:"confirmed"}]),
   rpc("getTokenSupply",[mint,{commitment:"confirmed"}]),
rpc("getAccountInfo",[mint,{encoding:"base64",commitment:"confirmed"}])
  ]);

  if(tasks[0].status==="fulfilled"){
   const pairs=tasks[0].value.pairs||[];
   market=pairs.filter(p=>p.chainId==="solana")
    .sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0]||null;
  }

  if(tasks[1].status==="fulfilled")rug=tasks[1].value;
  if(tasks[2].status==="fulfilled")mintInfo=tasks[2].value?.value;
  if(tasks[3].status==="fulfilled")holderData=tasks[3].value?.value;
  if(tasks[4].status==="fulfilled")supplyData=tasks[4].value?.value;
if(tasks[5].status==="fulfilled")mintRawInfo=tasks[5].value?.value;
 let tokenExtensions=[];
try{
  const raw=mintRawInfo?.data;
  if(Array.isArray(raw)&&typeof raw[0]==="string"){
    const bytes=Uint8Array.from(atob(raw[0]),c=>c.charCodeAt(0));
    if(bytes.length>=166){
      let offset=166;
      while(offset+4<=bytes.length){
        const type=bytes[offset]|(bytes[offset+1]<<8);
        const len=bytes[offset+2]|(bytes[offset+3]<<8);
        if(type===0&&len===0)break;
        if(offset+4+len>bytes.length)break;
        tokenExtensions.push(type);
        offset+=4+len;
      }
    }
  }
}catch(e){}

const extensionNames={
  1:"Transfer Fee — کرێی گواستنەوە",
  3:"Mint Close Authority",
  4:"Confidential Transfer",
  6:"Default Account State — دۆخی بنەڕەتی هەژمار",
  9:"Non-Transferable — نەتوانینی گواستنەوە",
  10:"Interest Bearing — سوودی تۆکن",
  12:"Permanent Delegate — دەسەڵاتی هەمیشەیی",
  14:"Transfer Hook — کۆدی تایبەت لە گواستنەوە",
  18:"Metadata Pointer",
  19:"Token Metadata",
  20:"Group Pointer",
  21:"Token Group",
  22:"Group Member Pointer",
  23:"Token Group Member",
  24:"Confidential Mint-Burn",
  25:"Scaled UI Amount",
  26:"Pausable — توانای وەستاندنی مامەڵە",
  28:"Permissioned Burn"
};

const foundExtensions=tokenExtensions.map(
  type=>extensionNames[type]||("Extension "+type)
);

const name=market?.baseToken?.name||"کۆینی نەناسراو";
  window.lastTokenPrice = Number(market?.priceUsd || 0);const symbol=market?.baseToken?.symbol||"---";
  el("coinName").textContent=name+" ("+symbol+")";

  if(!market){
   risk+=3;
   notes.push("زانیاری بازاڕ بەردەست نییە");
  }else{
   if((market.liquidity?.usd||0)<5000){
    risk+=3;
    notes.push("لیکوییدیتی زۆر کەمە");
   }else if(market.liquidity.usd<20000){
    risk+=1;
    notes.push("لیکوییدیتی مامناوەندە");
   }

   if((market.volume?.h24||0)<1000){
    risk+=2;
    notes.push("قەبارەی مامەڵەی ٢٤ کاتژمێر کەمە");
   }
  }

  const mintData=mintInfo?.data;
let mintAuth=null;
let freezeAuth=null;
let mintChecked=false;

if(mintData?.parsed?.info){
  mintAuth=!!mintData.parsed.info.mintAuthority;
  freezeAuth=!!mintData.parsed.info.freezeAuthority;
  mintChecked=true;
}else if(Array.isArray(mintData)&&typeof mintData[0]==="string"){
  try{
    const bytes=Uint8Array.from(atob(mintData[0]),c=>c.charCodeAt(0));
    if(bytes.length>=82){
      const readU32=(i)=>(
        bytes[i]|(bytes[i+1]<<8)|(bytes[i+2]<<16)|(bytes[i+3]<<24)
      );
      const mintOption=readU32(0);
      const freezeOption=readU32(46);
      if(mintOption<=1&&freezeOption<=1){
        mintAuth=mintOption===1;
        freezeAuth=freezeOption===1;
        mintChecked=true;
      }
    }
  }catch(e){}
}

const programOwner=mintInfo?.owner;

let mintStatus="داتا نییە";
let freezeStatus="داتا نییە";

if(!mintChecked){
  risk+=2;
  notes.push("پشکنینی Mint و Freeze بەردەست نەبوو");
}else{
  mintStatus=mintAuth?"چالاک ⚠️":"ناچالاک ✅";
  freezeStatus=freezeAuth?"چالاک ⚠️":"ناچالاک ✅";

  if(mintAuth){
    risk+=3;
    notes.push("Mint Authority چالاکە");
  }
  if(freezeAuth){
    risk+=3;
    notes.push("Freeze Authority چالاکە");
  }
}
         show("security",
    row("Mint Authority",mintStatus)+
    row("Freeze Authority",freezeStatus)+
    row("Token Program",programOwner||"داتا نییە")+
row("Token-2022 Extensions",
  foundExtensions.length
    ? foundExtensions.join("، ")
    : "هیچ Extension ـێک نەدۆزرایەوە"
)+
    (mintStatus==="داتا نییە" || freezeStatus==="داتا نییە"
      ? "<p class='bad'><b>⚠️ ئاگاداری: دۆخی Mint و Freeze پشتڕاست نەکراوەتەوە.</b></p>"
      : "")
  );

  if(!rug){
    risk+=2;
    notes.push("داتای RugCheck بەردەست نەبوو");
  }else if(rug.score!=null){
    if(rug.score>5000){
      risk+=3;
      notes.push("نمرەی مەترسی RugCheck بەرزە");
    }else if(rug.score>2500){
      risk+=2;
      notes.push("نمرەی مەترسی RugCheck مامناوەندە");
    }
  }

    let holderText="داتای خاوەنەکان بەردەست نییە";
  let largestText="نەزانراو";
  let topTenText="نەزانراو";
  let holderCount="نەزانراو";
  let holders=[];

  const total=Number(supplyData?.amount);

  if(Array.isArray(holderData)&&holderData.length&&total>0){
        holders=holderData.slice(0,10).map(x=>({
      address:x.address||"نەزانراو",
      owner:null,
      insider:null,
      pct:Number(x.amount)/total*100
    })).filter(x=>Number.isFinite(x.pct));

    holderCount=holderData.length;
    holderText="داتا لە RPC وەرگیرا";
  }

        if(!holders.length&&Array.isArray(rug?.topHolders)&&rug.topHolders.length){
    holders=rug.topHolders.slice(0,10).map(x=>({
      address:x.address||"نەزانراو",
      owner:x.owner||null,
      insider:x.insider??null,
      pct:Number(x.pct)
    })).filter(x=>Number.isFinite(x.pct));

    holderCount=rug.topHolders.length;
    holderText="داتا لە RugCheck وەرگیرا";
  }

  if(holders.length){
    const largest=Math.max(...holders.map(x=>x.pct));
    const topTen=holders.reduce((sum,x)=>sum+x.pct,0);

    largestText=largest.toFixed(2)+"%";
    topTenText=topTen.toFixed(2)+"%";

    if(largest>30){
      risk+=2;
      notes.push("گەورەترین هەژماری تۆکن بەشی زۆری هەیە");

      if(Number(market?.liquidity?.usd||0)<5000){
        risk+=2;
        notes.push("مەترسی زۆر بەرزە: کۆبوونەوەی زۆری کۆین لە یەک هەژمار و لیکوییدیتی زۆر کەم");
      }
    }else if(topTen>50){
      risk+=2;
      notes.push("١٠ هەژماری گەورەتر بەشی زۆریان هەیە");
    }
  }

  show("holders",
    row("دۆخی داتا",holderText)+
    row("گەورەترین هەژماری تۆکن",largestText)+
    row("کۆی ١٠ هەژماری گەورەتر",topTenText)+
    row("ژمارەی هەژمارە گەورەکان",holderCount)+
    (holders.length&&Math.max(...holders.map(x=>x.pct))>30
      ? "<p class='bad'><b>⚠️ ئاگاداری: یەک هەژمار زیاتر لە 30%ی کۆینەکەی هەیە!</b></p>"
      : "")+
        holders.map((x,i)=>
      row("هەژمار "+(i+1),
        safe(x.address)+" — "+x.pct.toFixed(2)+"%"+
        (x.owner?" | خاوەن: "+safe(x.owner):"")+
        (x.insider===true?" | ⚠️ Insider": "")
      )
    ).join("")+
    "<p class='small'>ئەم ناونیشانانە هەژماری تۆکنن؛ بە دڵنیایی ناونیشانی خاوەنە کۆتاییەکان نین.</p>"
  );



  

    const finalSells=Number(market?.txns?.h24?.sells||0);
  const finalLiquidity=Number(market?.liquidity?.usd||0);
     const largestPct=holders.length ?Math.max(...holders.map(x=>x.pct)):0;
  const topTenPct=holders.reduce((sum,x)=>sum+x.pct,0);

  if(topTenPct>50){
    notes.push("🚨 ئاگاداری: ١٠ هەژماری گەورەتر زیاتر لە 50%ی کۆینەکەیان هەیە.");
  }

  const noBuyWarning=largestPct>30 ||
    topTenPct>50 ||
    (finalLiquidity<5000 && finalSells===0);

    let sellText="داتای فرۆشتنی بازاڕ بەردەست نییە";
    

  if(finalLiquidity<5000 && finalSells===0){
    notes.push("🚨 ئاگاداری: لیکوییدیتی کەمترە لە $5,000 و هیچ فرۆشتنێک نییە؛ ئەم کۆینە مەکڕە.");
  }if(market){
   const sells=Number(market.txns?.h24?.sells||0);
   const buys=Number(market.txns?.h24?.buys||0);
   const liquidity=Number(market.liquidity?.usd||0);

   if(sells>0&&liquidity>=5000){
    sellText="<span class='warn'>مامەڵەی فرۆشتن لە بازاڕ تۆمار کراوە، بەڵام فرۆشتنی تۆ پشتڕاست نەکراوەتەوە.</span>";
   }else if(sells>0){
    sellText="<span class='bad'>هەندێک فرۆشتن تۆمار کراوە، بەڵام لیکوییدیتی زۆر کەمە.</span>";
   }else{
    sellText="<span class='bad'>هیچ فرۆشتنێک لە داتای ٢٤ کاتژمێردا تۆمار نەکراوە.</span>";
   }
   sellText+="<br>کڕین: "+buys+"، فرۆشتن: "+sells+"، لیکوییدیتی: "+money(liquidity);
  }

  show("selling",
   sellText+
   "<p class='small'>ئەمە تەنها داتای بازاڕە. بۆتەکە هیچ Swap یان مامەڵەیەکی تاقیکردنەوەیی ناکات. ناتوانێت دڵنیایی بدات کە تۆ دەتوانیت بفرۆشیت. هیچ Sign ـێکی نەناسراو مەدەرەوە.</p>"
  );

  let level=risk>=8
   ?"<span class='bad'>مەترسی بەرز</span>"
   :risk>=4
   ?"<span class='warn'>مەترسی مامناوەند</span>"
   :"<span class='good'>مەترسی کەمتر لە داتای بەردەستدا</span>";

  show("risk",`<h2>نمرەی مەترسی: ${risk} / 18</h2><h3>${level}</h3>`);

  show("conclusion",
   `<p>${noBuyWarning||risk>=8?"ئەم کۆینە مەترسییەکی بەرزی هەیە. پێشنیار ناکەم بیکڕیت.":risk>=4?"پێش کڕین پێویستی بە پشکنینی زیاتر هەیە.":"لە داتای بەردەستدا هەندێک نیشانە باشە، بەڵام ئەمە مانای سەلامەتی نییە."}</p>`+
   `<p>${notes.length?notes.map(safe).join("<br>"):"هۆشدارییەکی زۆر لە داتای بەردەستدا نەدۆزرایەوە."}</p>`+
   `<p class="small">نمرەکە هەڵسەنگاندنێکی سادەیە، نەک پێوانەی فەرمی یان گەرەنتی. داتای نەزانراو بە مانای سەلامەتبوون نییە.</p>`
  );

  el("result").style.display="block";
  el("status").textContent="پشکنین تەواو بوو.";
updateDemoProfit();
 }catch(e){
  el("status").textContent="هەڵە لە پشکنین: "+safe(e.message);
 }finally{
  el("scan").disabled=false;
 }
}
// ===== DEMO TRADING =====
let demoBalance = 100;
let demoTrades = [];
try {
  const saved = JSON.parse(
    localStorage.getItem("demoTradingData") || "null"
  );

  if (saved) {
    demoBalance = Number(saved.balance) || 100;
    demoTrades = Array.isArray(saved.trades)
      ? saved.trades
      : [];
  }
} catch (e) {
  demoBalance = 100;
  demoTrades = [];
}

function saveDemoState() {
  localStorage.setItem("demoTradingData", JSON.stringify({
    balance: demoBalance,
    trades: demoTrades
  }));
}
const demoPanel = document.createElement("div");
demoPanel.className = "section";
demoPanel.innerHTML = `
  <h2>🤖 کڕینی خەیاڵی</h2>
  <p>باڵانسی خەیاڵی: <b id="demoBalance">$100.00</b></p>
  <p>بڕی هەر کڕین: <b>$5</b></p>
  <button id="demoBuy">🧪 کڕینی خەیاڵی</button>
  <div id="demoStatus"></div>
  <div id="demoHistory"></div>
 <div id="demoProfit"></div> <p class="small">تەنها تاقیکردنەوەیە؛ هیچ پارەی ڕاستەقینە بەکارناهێنێت.</p>
`;

document.querySelector("main").insertBefore(
  demoPanel,
  document.querySelector("main").lastElementChild
);

document.getElementById("demoBuy").onclick = function () {
  const mint = document.getElementById("mint").value.trim();
  const status = document.getElementById("demoStatus");

  if (!mint || document.getElementById("result").style.display === "none") {
    status.innerText = "سەرەتا کۆینێک پشکنین بکە.";
    return;
  }

  const riskText = document.getElementById("risk").innerText;
  const riskMatch = riskText.match(/(\d+)\s*\/\s*18/);
  const risk = riskMatch ? Number(riskMatch[1]) : 99;

  if (risk > 3) {
    status.innerText = "⛔ مەترسی بەرزە؛ کڕینی خەیاڵی ڕەتکرایەوە.";
    return;
  }

  if (demoTrades.some(t => t.mint === mint)) {
    status.innerText = "ئەم کۆینە پێشتر تۆمارکراوە.";
    return;
  }

  if (demoBalance < 5) {
    status.innerText = "باڵانسی خەیاڵی بەس نییە.";
    return;
  }

  demoBalance -= 5;
  demoTrades.push({ mint, amount: 5 });
const price = Number(window.lastTokenPrice || 0);
if (price <= 0) {
  status.innerText = "نرخی کۆین بەردەست نییە؛ تۆمار نەکرا.";
  demoBalance += 5;
  demoTrades.pop();
  return;
}

demoTrades[demoTrades.length - 1].buyPrice = price;
demoTrades[demoTrades.length - 1].tokens = 5 / price;
 saveDemoState(); document.getElementById("demoBalance").innerText =
    "$" + demoBalance.toFixed(2);

  document.getElementById("demoHistory").innerHTML =
    "<p class='good'>✅ کڕینی خەیاڵی: $5</p>" +
    "<p class='small' dir='ltr'>" + mint + "</p>";

  status.innerText = "تەواو بوو؛ هیچ پارەی ڕاستەقینە نەچووە.";updateDemoProfit();
};function updateDemoProfit() {
  const box = document.getElementById("demoProfit");
  if (!box) return;

  const mint = document.getElementById("mint").value.trim();
  const price = Number(window.lastTokenPrice || 0);

  const trade = demoTrades.find(t => t.mint === mint);

  if (!trade || price <= 0) {
    box.innerText = "نرخی نوێ بۆ هەژمارکردنی قازانج بەردەست نییە.";
    return;
  }

  const value = trade.tokens * price;
  const profit = value - trade.amount;

  box.innerText =
    "قازانج / زیان: " +
    (profit >= 0 ? "+" : "") +
    "$" + profit.toFixed(2);
}
async function refreshDemoPrice() {
  const mint = document.getElementById("mint").value.trim();
  const trade = demoTrades.find(t => t.mint === mint);
  if (!trade || trade.sold) return;

  try {
    const data = await getJSON(
      "https://api.dexscreener.com/latest/dex/tokens/" + mint
    );
