
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پشکنەری زیرەکی کۆینی سولانا</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif;line-height:1.8}
main{max-width:850px;margin:auto}
header{text-align:center;margin:18px 0}
h1,h2{color:#60e6c0}
.panel,.section{background:#151d32;border:1px solid #293653;border-radius:14px;padding:16px;margin:14px 0}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #40506d;background:#0b1020;color:white;font-size:14px;direction:ltr}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;background:#16b891;color:#071a18;font-size:17px;font-weight:bold}
button:disabled{opacity:.5}
.item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #293653;padding:9px 0}
.value{direction:ltr;text-align:left;overflow-wrap:anywhere}
.good{color:#60e6a8}.bad{color:#ff7777}.warn{color:#ffd166}
.small{font-size:12px;color:#aab6d0}
#status{margin-top:12px;text-align:center;color:#ffd166}
</style>
</head>
<body>
<main>
<header>
<h1>🔎 پشکنەری زیرەکی کۆینی سولانا</h1>
<p>پشکنینی لیکوییدیتی، خاوەنەکان و مەترسی</p>
</header>

<div class="panel">
<h2>ناونیشانی کۆین</h2>
<input id="mint" placeholder="ناونیشانی Mint لێرە دابنێ" autocomplete="off">
<button id="scan" onclick="scanToken()">پشکنینی کۆین</button>
<div id="status"></div>
</div>

<div id="result" style="display:none">
<div class="section">
<h2 id="coinName">زانیاری کۆین</h2>
<div id="risk"></div>
<div id="basic"></div>
</div>

<div class="section">
<h2>📊 دۆخی بازاڕ</h2>
<div id="market"></div>
</div>

<div class="section">
<h2>🛡️ پشکنینی سەلامەتی</h2>
<div id="security"></div>
</div>

<div class="section">
<h2>👥 دابەشبوونی خاوەنەکان</h2>
<div id="holders"></div>
</div>

<div class="section">
<h2>💱 توانای فرۆشتن</h2>
<div id="selling"></div>
</div>

<div class="section">
<h2>⚠️ کۆتایی هەڵسەنگاندن</h2>
<div id="conclusion"></div>
</div>
</div>

<p class="small">تێبینی: هیچ پشکنینێک دڵنیایی تەواو نادات. ئەم بۆتە هیچ مامەڵەیەک ناکات و هیچ واژۆیەکت ناوێت.</p>
</main>

<script>
const RPCS=[
 "https://api.mainnet-beta.solana.com",
 "https://solana-rpc.publicnode.com"
];

function el(id){return document.getElementById(id)}
function show(id,value){el(id).innerHTML=value}
function row(label,value){
 return `<div class="item"><span>${label}</span><b class="value">${value}</b></div>`;
}
function safe(v){
 return String(v??"نەزانراو").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function money(v){
 return v==null||!Number.isFinite(Number(v))||Number(v)<=0
 ?"نەزانراو":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:8});
}
function number(v){
 return v==null?"نەزانراو":Number(v).toLocaleString("en-US");
}
function short(s){
 return s?s.slice(0,6)+"..."+s.slice(-6):"نەزانراو";
}

async function getJSON(url,options={}){
 const r=await fetch(url,options);
 if(!r.ok)throw new Error("HTTP "+r.status);
 return r.json();
}

async function rpc(method,params){
 let lastError;
 for(const endpoint of RPCS){
  try{
   const j=await getJSON(endpoint,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     jsonrpc:"2.0",id:1,method,params
    })
   });
   if(j.error)throw new Error(j.error.message);
   return j.result;
  }catch(e){
   lastError=e;
  }
 }
 throw lastError||new Error("RPC unavailable");
}

async function scanToken(){
 const mint=el("mint").value.trim();

 if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(mint)){
  el("status").textContent="تکایە ناونیشانی دروستی کۆین بنووسە.";
  return;
 }

 el("scan").disabled=true;
 el("status").textContent="لە پشکنین دام... تکایە چاوەڕێ بکە";
 el("result").style.display="none";

 try{
  let risk=0,notes=[],market=null,rug=null;
  let mintInfo=null,holderData=null,supplyData=null;

  const tasks=await Promise.allSettled([
   getJSON("https://api.dexscreener.com/latest/dex/tokens/"+mint),
   getJSON("https://api.rugcheck.xyz/v1/tokens/"+mint+"/report"),
   rpc("getAccountInfo",[mint,{encoding:"jsonParsed",commitment:"confirmed"}]),
   rpc("getTokenLargestAccounts",[mint,{commitment:"confirmed"}]),
   rpc("getTokenSupply",[mint,{commitment:"confirmed"}])
  ]);

  if(tasks[0].status==="fulfilled"){
   const pairs=tasks[0].value.pairs||[];
   market=pairs.filter(p=>p.chainId==="solana")
    .sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0]||null;
  }

  if(tasks[1].status==="fulfilled")rug=tasks[1].value;
  if(tasks[2].status==="fulfilled")mintInfo=tasks[2].value?.value;
  if(tasks[3].status==="fulfilled")holderData=tasks[3].value?.value;
  if(tasks[4].status==="fulfilled")supplyData=tasks[4].value?.value;

  const name=market?.baseToken?.name||"کۆینی نەناسراو";
  const symbol=market?.baseToken?.symbol||"---";
  el("coinName").textContent=name+" ("+symbol+")";

  if(!market){
   risk+=3;
   notes.push("زانیاری بازاڕ بەردەست نییە");
  }else{
   if((market.liquidity?.usd||0)<5000){
    risk+=3;
    notes.push("لیکوییدیتی زۆر کەمە");
   }else if(market.liquidity.usd<20000){
    risk+=1;
    notes.push("لیکوییدیتی مامناوەندە");
   }

   if((market.volume?.h24||0)<1000){
    risk+=2;
    notes.push("قەبارەی مامەڵەی ٢٤ کاتژمێر کەمە");
   }
  }

  const parsed=mintInfo?.data?.parsed?.info;
  const mintAuth=parsed?.mintAuthority;
  const freezeAuth=parsed?.freezeAuthority;
  const programOwner=mintInfo?.owner;
  const mintChecked=!!parsed;

  if(!mintChecked){
   risk+=2;
   notes.push("پشکنینی Mint و Freeze بەردەست نەبوو");
  }else{
   if(mintAuth){
    risk+=3;
    notes.push("Mint Authority چالاکە");
   }
   if(freezeAuth){
    risk+=3;
    notes.push("Freeze Authority چالاکە");
   }
  }

  if(!rug){
   risk+=2;
   notes.push("داتای RugCheck بەردەست نەبوو");
  }else if(rug.score!=null){
   if(rug.score>5000){
    risk+=3;
    notes.push("نمرەی مەترسی RugCheck بەرزە");
   }else if(rug.score>2500){
    risk+=2;
    notes.push("نمرەی مەترسی RugCheck مامناوەندە");
   }
  }

  let holderText="داتای خاوەنەکان بەردەست نییە";
let largestText="نەزانراو";
let topTenText="نەزانراو";
let holderCount="نەزانراو";

let holders=[];

if(holderData?.length && supplyData?.amount){
  const total=Number(supplyData.amount);
  if(total>0){
    holders=holderData.slice(0,10).map(x=>({
      pct:Number(x.amount)/total*100
    }));
    holderCount=holderData.length;
    holderText="داتا لە RPC وەرگیرا";
  }
}

if(!holders.length && Array.isArray(rug?.topHolders) && rug.topHolders.length){
  holders=rug.topHolders.slice(0,10).map(x=>({
    pct:Number(x.pct)
  })).filter(x=>Number.isFinite(x.pct));
  if(holders.length){
    holderCount=rug.topHolders.length;
    holderText="داتا لە RugCheck وەرگیرا";
  }
}

if(holders.length){
  const largest=Math.max(...holders.map(x=>x.pct));
  const topTen=holders.reduce((sum,x)=>sum+x.pct,0);

  largestText=largest.toFixed(2)+"%";
  topTenText=topTen.toFixed(2)+"%";

  if(largest>30){
    risk+=2;
    notes.push("گەورەترین هەژماری تۆکن بەشی زۆری هەیە");
  }else if(topTen>50){
    risk+=2;
    notes.push("١٠ هەژماری گەورەتر بەشی زۆریان هەیە");
  }
}
   const accounts=holderData.slice(0,10);
   const topAmount=Number(accounts[0]?.amount||0);
   const tenAmount=accounts.reduce((sum,x)=>sum+Number(x.amount||0),0);

   if(totalSupply>0){
    largestPercent=topAmount/totalSupply*100;
    topTenPercent=tenAmount/totalSupply*100;

    largestText=largestPercent.toFixed(2)+"%";
    topTenText=topTenPercent.toFixed(2)+"%";
    holderText="داتای ١٠ هەژماری گەورەتر بەردەستە";

    if(largestPercent>30){
     risk+=2;
     notes.push("یەک هەژماری تۆکن بڕێکی زۆری تۆکنی هەیە");
    }else if(topTenPercent>50){
     risk+=2;
     notes.push("١٠ هەژماری گەورەتر بەشی زۆری تۆکنیان هەیە");
    }
   }
  }

  show("basic",
   row("ناونیشان",short(mint))+
   row("DEX",market?.dexId||"نەزانراو")+
   row("نرخ",money(market?.priceUsd))+
   row("Token Program",programOwner==="TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"?"Token-2022":programOwner?"Token Program":"نەزانراو")
  );

  show("market",
   row("لیکوییدیتی",money(market?.liquidity?.usd))+
   row("قەبارەی مامەڵەی ٢٤ کاتژمێر",money(market?.volume?.h24))+
   row("کڕین / فرۆشتن",market?number(market.txns?.h24?.buys)+" / "+number(market.txns?.h24?.sells):"نەزانراو")+
   row("FDV",money(market?.fdv))
  );

  show("security",
   row("Mint Authority",mintChecked?(mintAuth?"<span class='bad'>چالاکە</span>":"<span class='good'>ناچالاکە</span>"):"<span class='warn'>نەزانراو</span>")+
   row("Freeze Authority",mintChecked?(freezeAuth?"<span class='bad'>چالاکە</span>":"<span class='good'>ناچالاکە</span>"):"<span class='warn'>نەزانراو</span>")+
   row("RugCheck Score",rug?.score??"نەزانراو")+
   row("هۆشدارییەکان",rug?.risks?.length?rug.risks.map(x=>safe(x.name)).join("، "):"هیچ هۆشدارییەکی گەڕاوە نییە")
  );

  show("holders",
   row("دۆخی داتا",holderText)+
   row("گەورەترین هەژماری تۆکن",largestText)+
   row("کۆی ١٠ هەژماری گەورەتر",topTenText)+
   row("ژمارەی هەژمارە گەورەکان",holderData?.length??"نەزانراو")+
   "<p class='small'>ئەمە هەژمارەکانی تۆکنە، نەک بە دڵنیایی خاوەنە کۆتاییەکان. هەژمارەکان دەتوانن هی لیکوییدیتی یان خزمەتگوزارییەکان بن. ئەم لیستە تەنها ١٠ هەژماری گەورەتر نیشان دەدات.</p>"
  );

  let sellText="داتای فرۆشتنی بازاڕ بەردەست نییە";
  if(market){
   const sells=Number(market.txns?.h24?.sells||0);
   const buys=Number(market.txns?.h24?.buys||0);
   const liquidity=Number(market.liquidity?.usd||0);

   if(sells>0&&liquidity>=5000){
    sellText="<span class='warn'>مامەڵەی فرۆشتن لە بازاڕ تۆمار کراوە، بەڵام فرۆشتنی تۆ پشتڕاست نەکراوەتەوە.</span>";
   }else if(sells>0){
    sellText="<span class='bad'>هەندێک فرۆشتن تۆمار کراوە، بەڵام لیکوییدیتی زۆر کەمە.</span>";
   }else{
    sellText="<span class='bad'>هیچ فرۆشتنێک لە داتای ٢٤ کاتژمێردا تۆمار نەکراوە.</span>";
   }
   sellText+="<br>کڕین: "+buys+"، فرۆشتن: "+sells+"، لیکوییدیتی: "+money(liquidity);
  }

  show("selling",
   sellText+
   "<p class='small'>ئەمە تەنها داتای بازاڕە. بۆتەکە هیچ Swap یان مامەڵەیەکی تاقیکردنەوەیی ناکات. ناتوانێت دڵنیایی بدات کە تۆ دەتوانیت بفرۆشیت. هیچ Sign ـێکی نەناسراو مەدەرەوە.</p>"
  );

  let level=risk>=8
   ?"<span class='bad'>مەترسی بەرز</span>"
   :risk>=4
   ?"<span class='warn'>مەترسی مامناوەند</span>"
   :"<span class='good'>مەترسی کەمتر لە داتای بەردەستدا</span>";

  show("risk",`<h2>نمرەی مەترسی: ${risk} / 18</h2><h3>${level}</h3>`);

  show("conclusion",
   `<p>${risk>=8?"ئەم کۆینە مەترسییەکی بەرزی هەیە. پێشنیار ناکەم بیکڕیت.":risk>=4?"پێش کڕین پێویستی بە پشکنینی زیاتر هەیە.":"لە داتای بەردەستدا هەندێک نیشانە باشە، بەڵام ئەمە مانای سەلامەتی نییە."}</p>`+
   `<p>${notes.length?notes.map(safe).join("<br>"):"هۆشدارییەکی زۆر لە داتای بەردەستدا نەدۆزرایەوە."}</p>`+
   `<p class="small">نمرەکە هەڵسەنگاندنێکی سادەیە، نەک پێوانەی فەرمی یان گەرەنتی. داتای نەزانراو بە مانای سەلامەتبوون نییە.</p>`
  );

  el("result").style.display="block";
  el("status").textContent="پشکنین تەواو بوو.";

 }catch(e){
  el("status").textContent="هەڵە لە پشکنین: "+safe(e.message);
 }finally{
  el("scan").disabled=false;
 }
}
</script>
</body>
</html>
