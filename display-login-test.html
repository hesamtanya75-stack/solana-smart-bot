<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login display test</title>
<style>
html,body{margin:0;min-height:100%;background:#060914;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}
#serverLogin{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(3,7,19,.94);backdrop-filter:blur(14px)}
#serverLogin .login-card{width:min(420px,100%);padding:22px;border:1px solid rgba(155,108,255,.42);border-radius:20px;background:linear-gradient(145deg,#1b1438,#0a1b30);box-shadow:0 18px 55px #0009;text-align:right;box-sizing:border-box}
#serverLogin h2{margin:0 0 10px;color:#fff;font-size:18px}
#serverLogin p{color:#c2d6ed;font-size:12px;line-height:1.7}
#serverLogin input{width:100%;height:44px;margin:10px 0;padding:10px;border:1px solid rgba(132,151,255,.3);border-radius:11px;background:#070f20;color:#fff;box-sizing:border-box}
#serverLogin button{width:100%;height:44px;border:0;border-radius:11px;background:#7c4dff;color:white;font-weight:bold}
</style>
</head>
<body>
<div id="serverLogin" role="dialog" aria-modal="true">
<div class="login-card">
<h2>🔐 چوونەژوورەوەی بۆتی سێرڤەر</h2>
<p>ئەمە تاقیکردنەوەی پەنجەرەی چوونەژوورەوەی داشبۆردە.</p>
<input type="password" placeholder="وشەی نهێنی">
<button>چوونەژوورەوە</button>
<p>تەنها تاقیکردنەوەی خەیاڵییە.</p>
</div></div>
</body></html>
