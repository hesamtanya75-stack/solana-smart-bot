<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium CSS Valid Half 2</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060914;color:#fff;font-family:system-ui,sans-serif}body{padding:12px}header{padding:16px;margin-bottom:12px;border:1px solid #27e7d3;border-radius:15px}.section{padding:16px;margin:10px 0;border:1px solid #9b6cff;border-radius:15px}</style><style>
#demoPanel .bot-head h2{margin:0!important;padding:0!important;border:0!important;color:#fff!important;font-size:18px!important}
#demoPanel .bot-kicker,#demoPanel .eyebrow{color:#b69aff!important;font-size:10px!important;letter-spacing:1.5px!important}

#demoPanel .dashboard{
  grid-column:1/-1!important;padding:14px!important;border:1px solid rgba(155,108,255,.3)!important;

}

#demoPanel .dash-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important;margin-top:11px!important}

#demoPanel .dash-foot{margin-top:10px!important;color:#c4d2e8!important}
#demoPanel .dash-foot strong{color:#55e8bd!important}

#demoPanel .demo-metrics{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}

#demoPanel #demoStats{border:1px solid rgba(132,151,255,.18)!important;border-radius:13px!important;background:#09172d!important}

  #result>.section:first-child h2{font-size:15px!important}

@media(max-width:390px){
  #result{grid-template-columns:1fr!important}
  #result>.section:first-child{grid-column:1!important}
  main>#demoPanel{grid-template-columns:1fr!important}
  #demoPanel .bot-head,#demoPanel .dashboard,#demoPanel #demoStatus,#demoPanel #demoProfit,#demoPanel #walletPanel{grid-column:1!important}
}

</style></head><body><header><h1>🔎 پشکنەری زیرەکی کۆینی سولانا 🚀</h1></header><main><section id="result" class="section"><h2>پشکنینی سەلامەتی</h2><p>CSS valid half 2</p></section><section id="demoPanel" class="section"><div class="bot-head"><h2>ڕۆبۆتی ئۆتۆماتیکی</h2></div><div class="dashboard"><h2>پوختەی بۆت</h2><p>باڵانس: $100</p></div><p id="demoStatus">دۆخی تاقیکردنەوە</p></section></main></body></html>
